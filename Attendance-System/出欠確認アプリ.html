<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出欠確認アプリ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
    <style>
        /* 見栄えの良い細いスクロールバーのカスタムCSS */
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="root"></div>

    <script type="text/babel" data-presets="react,env">
        const { useState, useMemo, useEffect, useCallback, useRef } = React;

        // --- アイコンコンポーネント (SVG) ---
        const IconUpload = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        );
        const IconDownload = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        );
        const IconChevronLeft = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        );
        const IconChevronRight = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        );

        // YYYY/MM/DD の日付キーを MM/DD(曜) に変換する関数
        const formatLabel = (dateKey) => {
            const d = new Date(dateKey);
            if (isNaN(d.getTime())) return dateKey;
            const dayNames = ['(日)', '(月)', '(火)', '(水)', '(木)', '(金)', '(土)'];
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${mm}/${dd}${dayNames[d.getDay()]}`;
        };

        // --- カレンダーピッカーコンポーネント ---
        const CalendarPicker = ({ startDate, endDate, onChange, allDates }) => {
            const [currentMonth, setCurrentMonth] = useState(() => {
                if (startDate) return new Date(startDate);
                if (allDates && allDates.length > 0) return new Date(allDates[allDates.length - 1]);
                return new Date();
            });
            const [hoverDate, setHoverDate] = useState(null);
            const [step, setStep] = useState(0);

            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDay = new Date(year, month, 1).getDay();

            // データの最小・最大日付を取得
            const minDateStr = allDates && allDates.length > 0 ? allDates[0] : null;
            const maxDateStr = allDates && allDates.length > 0 ? allDates[allDates.length - 1] : null;

            // 前の月へ移動可能か判定
            const isPrevDisabled = useMemo(() => {
                if (!minDateStr) return false;
                const [minY, minM] = minDateStr.split('/').map(Number);
                return year < minY || (year === minY && month <= minM - 1);
            }, [year, month, minDateStr]);

            // 次の月へ移動可能か判定
            const isNextDisabled = useMemo(() => {
                if (!maxDateStr) return false;
                const [maxY, maxM] = maxDateStr.split('/').map(Number);
                return year > maxY || (year === maxY && month >= maxM - 1);
            }, [year, month, maxDateStr]);

            const prevMonth = () => {
                if (!isPrevDisabled) setCurrentMonth(new Date(year, month - 1, 1));
            };
            const nextMonth = () => {
                if (!isNextDisabled) setCurrentMonth(new Date(year, month + 1, 1));
            };

            const handleDateClick = (dateStr) => {
                if (step === 0) {
                    onChange(dateStr, dateStr);
                    setStep(1);
                } else {
                    if (dateStr < startDate) {
                        onChange(dateStr, startDate);
                    } else {
                        onChange(startDate, dateStr);
                    }
                    setStep(0);
                }
            };

            const days = [];
            for (let i = 0; i < firstDay; i++) {
                days.push(null);
            }
            for (let i = 1; i <= daysInMonth; i++) {
                const d = String(i).padStart(2, '0');
                const m = String(month + 1).padStart(2, '0');
                days.push(`${year}/${m}/${d}`);
            }
            
            // カレンダーの高さ（6週分）を固定するため、42マスになるまでnullで埋める
            while (days.length < 42) {
                days.push(null);
            }

            return (
                <div className="w-full select-none">
                    <div className="flex justify-between items-center mb-4">
                        <button 
                            onClick={prevMonth} 
                            disabled={isPrevDisabled}
                            className={`p-1.5 rounded-md transition-colors ${isPrevDisabled ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-100'}`}
                        >
                            <IconChevronLeft />
                        </button>
                        <div className="font-bold text-gray-800">{year}年 {month + 1}月</div>
                        <button 
                            onClick={nextMonth} 
                            disabled={isNextDisabled}
                            className={`p-1.5 rounded-md transition-colors ${isNextDisabled ? 'text-gray-300 cursor-not-allowed' : 'text-gray-600 hover:bg-gray-100'}`}
                        >
                            <IconChevronRight />
                        </button>
                    </div>
                    <div className="grid grid-cols-7 gap-1 text-center text-xs mb-2 font-medium text-gray-500">
                        <div className="text-red-500">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div className="text-blue-500">土</div>
                    </div>
                    <div className="grid grid-cols-7 gap-y-1 text-sm">
                        {days.map((d, i) => {
                            if (!d) return <div key={i} className="py-1"><div className="w-8 h-8"></div></div>;
                            
                            let isSelected = false;
                            let isInRange = false;
                            let isStart = false;
                            let isEnd = false;

                            const activeHover = step === 1 && hoverDate;
                            const tempStart = activeHover && hoverDate < startDate ? hoverDate : startDate;
                            const tempEnd = activeHover && hoverDate > startDate ? hoverDate : (step === 1 ? startDate : endDate);

                            if (startDate && tempEnd) {
                                isStart = d === tempStart;
                                isEnd = d === tempEnd;
                                isSelected = isStart || isEnd;
                                isInRange = d >= tempStart && d <= tempEnd;
                            } else if (startDate && !tempEnd) {
                                isStart = d === startDate;
                                isSelected = isStart;
                            }

                            // データの範囲内かどうかを判定
                            const isSelectable = minDateStr && maxDateStr ? (d >= minDateStr && d <= maxDateStr) : true;
                            const hasData = allDates.includes(d);
                            
                            let bgClass = "bg-white";
                            let textClass = hasData ? "text-gray-800 font-medium" : "text-gray-400";
                            if (!isSelectable) textClass = "text-gray-200"; // 範囲外はより薄く
                            
                            let wrapperClass = "rounded-lg";

                            if (isInRange && isSelectable) {
                                wrapperClass = "bg-blue-50";
                                if (isStart) wrapperClass += " rounded-l-lg";
                                if (isEnd) wrapperClass += " rounded-r-lg";
                                if (isStart && isEnd) wrapperClass = "rounded-lg";
                            }
                            if (isSelected) {
                                bgClass = "bg-blue-500";
                                textClass = "text-white font-bold shadow-sm";
                            }

                            return (
                                <div key={i} className={`relative flex items-center justify-center py-1 ${wrapperClass}`}>
                                    <button
                                        onClick={() => isSelectable && handleDateClick(d)}
                                        onMouseEnter={() => isSelectable && setHoverDate(d)}
                                        onMouseLeave={() => setHoverDate(null)}
                                        disabled={!isSelectable}
                                        className={`w-8 h-8 flex items-center justify-center transition-colors ${isSelected ? bgClass : (isInRange && isSelectable ? 'hover:bg-blue-100' : (isSelectable ? 'hover:bg-gray-100' : ''))} ${textClass} rounded-full z-10 ${!isSelectable ? 'cursor-not-allowed' : ''}`}
                                    >
                                        {parseInt(d.slice(-2), 10)}
                                    </button>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        function App() {
            // 初期データ（キーを YYYY/MM/DD 形式で統一）
            const initialData = [
                { '番号': '1', '氏名': '阿久津 滉祐', '回数': 0, '2026/04/24': '', '2026/04/25': '' },
                { '番号': '2', '氏名': '小豆畑 未來', '回数': 1, '2026/04/24': '', '2026/04/25': '欠席' },
                { '番号': '14', '氏名': '古閑 誉之助', '回数': 1, '2026/04/24': '欠席', '2026/04/25': '' },
            ];

            const [rawData, setRawData] = useState(initialData);
            const [sortConfig, setSortConfig] = useState({ key: '番号', direction: 'asc' });
            const [viewMode, setViewMode] = useState('10days'); // '10days', 'graph'
            
            // 基準日（リスト内のインデックス）を管理
            const [currentIndex, setCurrentIndex] = useState(-1);
            
            // ダウンロードモーダルの状態
            const [isDownloadModalOpen, setIsDownloadModalOpen] = useState(false);
            const [downloadStartDate, setDownloadStartDate] = useState('');
            const [downloadEndDate, setDownloadEndDate] = useState('');

            // 動的に計算された表示可能ブロック数
            const [graphDays, setGraphDays] = useState(31);
            const graphCellRef = useRef(null);

            // ウィンドウ幅（テーブルセルの幅）に応じてブロック数を自動計算
            useEffect(() => {
                if (viewMode !== 'graph') return;
                
                const observer = new ResizeObserver((entries) => {
                    for (let entry of entries) {
                        const width = entry.contentRect.width;
                        // 1ブロック 18px (w-4(16px) + space-x(2px))、両端の余白を少し考慮
                        const days = Math.floor((width - 8) / 18);
                        setGraphDays(prev => {
                            const newDays = days > 0 ? days : 1;
                            if (prev !== newDays) return newDays;
                            return prev;
                        });
                    }
                });

                if (graphCellRef.current) {
                    observer.observe(graphCellRef.current);
                }

                return () => observer.disconnect();
            }, [viewMode]);

            // CSVに存在する全ての日付（YYYY/MM/DD）のリスト
            const allDates = useMemo(() => {
                if (rawData.length === 0) return [];
                const keys = new Set();
                rawData.forEach(row => {
                    Object.keys(row).forEach(k => {
                        // YYYY/MM/DD の形式のキーだけを抽出
                        if (/^\d{4}\/\d{2}\/\d{2}$/.test(k)) keys.add(k);
                    });
                });
                return Array.from(keys).sort(); 
            }, [rawData]);

            // 最新の日付（右端）へジャンプする処理
            const jumpToLatest = useCallback(() => {
                if (allDates.length === 0) return;
                setCurrentIndex(allDates.length - 1);
            }, [allDates]);

            // ファイル読み込み時など、データが更新されたら最新の日付を右端にセットし直す
            useEffect(() => {
                jumpToLatest();
            }, [allDates, jumpToLatest]);

            // 存在するデータの中から、右端のインデックスを基準に過去に遡って指定日数分を取得する
            const getTargetDays = useCallback((dates, endIdx, totalDays) => {
                if (dates.length === 0 || endIdx < 0) return [];
                
                let start = endIdx - totalDays + 1;
                if (start < 0) start = 0;
                
                const targetDays = [];
                for (let i = start; i <= endIdx; i++) {
                    targetDays.push({
                        key: dates[i],
                        label: formatLabel(dates[i]),
                        isToday: i === endIdx // 基準日（右端）かどうか
                    });
                }
                return targetDays;
            }, []);

            const targetDays10 = useMemo(() => getTargetDays(allDates, currentIndex, 10), [allDates, currentIndex, getTargetDays]);
            const targetDaysGraph = useMemo(() => getTargetDays(allDates, currentIndex, graphDays), [allDates, currentIndex, graphDays, getTargetDays]);
            
            let displayColumns = [];
            if (viewMode === '10days') {
                displayColumns = [
                    { key: '番号', label: '番号' },
                    { key: '氏名', label: '氏名' },
                    { key: '回数', label: '回数' },
                    ...targetDays10
                ];
            } else if (viewMode === 'graph') {
                displayColumns = [
                    { key: '番号', label: '番号' },
                    { key: '氏名', label: '氏名' },
                    { key: '回数', label: '回数' },
                    { key: 'status_graph', label: '稼働状況' }
                ];
            }

            // 現在のモードに応じた表示日数を取得
            const currentTotalDays = viewMode === '10days' ? 10 : graphDays;
            
            // 過去に戻れる最小のインデックス（左端が一番古いデータを切らないように）
            const minIndex = Math.max(0, Math.min(currentTotalDays - 1, allDates.length - 1));

            const intervalRef = useRef(null);
            const timeoutRef = useRef(null);

            // 基準日を1つ前／次へ移動（1日ずつスクロール）
            const prevDay = useCallback(() => {
                setCurrentIndex(prev => {
                    const cTotal = viewMode === '10days' ? 10 : graphDays;
                    const mIdx = Math.max(0, Math.min(cTotal - 1, allDates.length - 1));
                    return prev > mIdx ? prev - 1 : prev;
                });
            }, [viewMode, graphDays, allDates.length]);
            
            const nextDay = useCallback(() => {
                setCurrentIndex(prev => prev < allDates.length - 1 ? prev + 1 : prev);
            }, [allDates.length]);

            // ボタン長押しでの連続スクロール処理
            const handlePointerDown = (direction) => {
                if (direction === 'prev') prevDay();
                else nextDay();

                timeoutRef.current = setTimeout(() => {
                    intervalRef.current = setInterval(() => {
                        if (direction === 'prev') prevDay();
                        else nextDay();
                    }, 80); 
                }, 400); 
            };

            const handlePointerUpOrLeave = () => {
                if (timeoutRef.current) clearTimeout(timeoutRef.current);
                if (intervalRef.current) clearInterval(intervalRef.current);
            };

            const requestSort = (key) => {
                if (key === '番号') {
                    setSortConfig({ key: '番号', direction: 'asc' });
                } else if (key === '回数') {
                    setSortConfig({ key: '回数', direction: 'desc' });
                }
            };

            const sortedData = useMemo(() => {
                const sortableData = rawData.map(row => {
                    const newRow = { ...row };
                    if (viewMode === '10days') {
                        let count = 0;
                        targetDays10.forEach(day => {
                            const status = newRow[day.key];
                            if (status === '欠席' || status === '1') {
                                count++;
                            }
                        });
                        newRow['回数'] = count;
                    }
                    return newRow;
                });

                if (sortConfig.key) {
                    sortableData.sort((a, b) => {
                        let valA = a[sortConfig.key];
                        let valB = b[sortConfig.key];
                        if (sortConfig.key === '番号' || sortConfig.key === '回数') {
                            valA = valA === undefined || valA === '' ? 0 : parseInt(valA, 10);
                            valB = valB === undefined || valB === '' ? 0 : parseInt(valB, 10);
                        }
                        if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                        if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                        return 0;
                    });
                }
                return sortableData;
            }, [rawData, sortConfig, viewMode, targetDays10]);

            const handleFileUpload = async (event) => {
                const files = Array.from(event.target.files).filter(file => file.name.toLowerCase().endsWith('.csv'));
                if (files.length === 0) return;

                const latestFilesMap = new Map();
                files.forEach(file => {
                    const match = file.name.match(/(\d{8})/); 
                    if (match) {
                        const dateStr = match[1];
                        if (!latestFilesMap.has(dateStr)) {
                            latestFilesMap.set(dateStr, file);
                        } else {
                            const existingFile = latestFilesMap.get(dateStr);
                            if (file.name > existingFile.name || (file.name === existingFile.name && file.lastModified > existingFile.lastModified)) {
                                latestFilesMap.set(dateStr, file);
                            }
                        }
                    } else {
                        latestFilesMap.set(file.name, file);
                    }
                });

                const targetFiles = Array.from(latestFilesMap.values());
                const filePromises = targetFiles.map((file) => {
                    return new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve({ name: file.name, text: e.target.result });
                        reader.readAsText(file);
                    });
                });

                try {
                    const fileResults = await Promise.all(filePromises);
                    const mergedData = {};
                    fileResults.forEach(({ text }) => {
                        const lines = text.trim().split(/\r?\n/).filter(line => line.trim() !== '');
                        if (lines.length < 2) return; 
                        const originalHeaders = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
                        const nameIndex = originalHeaders.indexOf('氏名');
                        const numIndex = originalHeaders.indexOf('番号');
                        if (nameIndex === -1) return; 

                        const headers = originalHeaders.map(h => {
                            if (h === '氏名' || h === '番号') return h;
                            let yyyy, mm, dd;
                            const parts = h.split(/[\/\-]/);
                            if (parts.length === 3) {
                                yyyy = parts[0];
                                mm = parts[1].padStart(2, '0');
                                dd = parts[2].padStart(2, '0');
                            } else if (parts.length === 2) {
                                yyyy = new Date().getFullYear().toString();
                                mm = parts[0].padStart(2, '0');
                                dd = parts[1].padStart(2, '0');
                            } else {
                                return h;
                            }
                            return `${yyyy}/${mm}/${dd}`;
                        });

                        for (let i = 1; i < lines.length; i++) {
                            const rowValues = lines[i].split(',').map(v => v.trim().replace(/^"|"$/g, ''));
                            const name = rowValues[nameIndex];
                            if (!name) continue;
                            if (!mergedData[name]) {
                                mergedData[name] = { 
                                    '番号': numIndex !== -1 ? rowValues[numIndex] : '',
                                    '氏名': name,
                                    '回数': 0
                                };
                            }
                            headers.forEach((header, index) => {
                                if (header !== '氏名' && header !== '番号' && header) {
                                    const val = rowValues[index];
                                    if (val === '1') mergedData[name][header] = '欠席';
                                    else mergedData[name][header] = '';
                                }
                            });
                        }
                    });

                    const finalData = Object.values(mergedData).map(row => {
                        let absents = 0;
                        Object.keys(row).forEach(key => {
                            if (key !== '番号' && key !== '氏名' && key !== '回数') {
                                if (row[key] === '欠席') absents++;
                            }
                        });
                        row['回数'] = absents;
                        return row;
                    });
                    setRawData(finalData);
                } catch (error) {
                    console.error(error);
                }
                event.target.value = '';
            };

            const handleOpenDownloadModal = () => {
                if (sortedData.length === 0 || allDates.length === 0) return;
                
                let defaultStart = allDates[0];
                let defaultEnd = allDates[allDates.length - 1];

                if (viewMode === '10days' && targetDays10.length > 0) {
                    defaultStart = targetDays10[0].key;
                    defaultEnd = targetDays10[targetDays10.length - 1].key;
                } else if (viewMode === 'graph' && targetDaysGraph.length > 0) {
                    defaultStart = targetDaysGraph[0].key;
                    defaultEnd = targetDaysGraph[targetDaysGraph.length - 1].key;
                }

                setDownloadStartDate(defaultStart);
                setDownloadEndDate(defaultEnd);
                setIsDownloadModalOpen(true);
            };

            const executeDownload = () => {
                if (sortedData.length === 0 || !downloadStartDate || !downloadEndDate) return;
                
                const start = downloadStartDate <= downloadEndDate ? downloadStartDate : downloadEndDate;
                const end = downloadStartDate <= downloadEndDate ? downloadEndDate : downloadStartDate;
                
                const targetKeys = allDates.filter(d => d >= start && d <= end);
                
                if (targetKeys.length === 0) {
                    alert("指定された期間内にデータが存在しません。");
                    return;
                }
                
                const downloadColumns = [
                    { key: '番号', label: '番号' },
                    { key: '氏名', label: '氏名' },
                    { key: '回数', label: '回数' },
                    ...targetKeys.map(d => ({ key: d, label: d }))
                ];

                const exportData = sortedData.map(row => {
                    let count = 0;
                    targetKeys.forEach(key => {
                        if (row[key] === '欠席' || row[key] === '1') count++;
                    });
                    return { ...row, exportCount: count };
                });

                const headerRow = downloadColumns.map(c => c.label).join(',');
                const bodyRows = exportData.map(row => 
                    downloadColumns.map(col => {
                        if (col.key === '回数') return `"${row.exportCount}"`;
                        return `"${row[col.key] !== undefined ? row[col.key] : '-'}"`;
                    }).join(',')
                );
                const csvText = [headerRow, ...bodyRows].join('\n');
                const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
                const blob = new Blob([bom, csvText], { type: 'text/csv;charset=utf-8;' });
                
                const getMMDD = (dateKey) => dateKey.split('/').slice(1).join('');
                const fileName = `出欠状況（${getMMDD(downloadStartDate)}-${getMMDD(downloadEndDate)}）.csv`;
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                setIsDownloadModalOpen(false);
            };

            // 列の幅を調整（10日モードで画面に収まるように少しコンパクトに）
            const getWidthClass = (key) => {
                if (key === '番号') return 'w-12 min-w-[3.5rem] max-w-[4rem]';
                if (key === '氏名') return 'w-32 min-w-[8rem] max-w-[12rem]';
                if (key === '回数') return 'w-12 min-w-[3.5rem] max-w-[4rem]';
                if (key.startsWith('status_graph')) return 'w-auto w-full min-w-[15rem]'; // 残りの幅を最大限に使用
                return 'w-20 min-w-[5.5rem] max-w-[6rem]'; // 日付列
            };

            return (
                // 画面全体の幅を max-w-7xl (1280px) に拡張して横スクロールを防止
                <div className="min-h-screen bg-gray-50 text-gray-800 font-sans p-2 sm:p-6">
                    <div className="max-w-7xl mx-auto space-y-6">
                        <header className="bg-white shadow-sm rounded-xl p-4 sm:p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                            <h1 className="text-xl sm:text-2xl font-bold text-gray-800">出欠状況</h1>
                            <div className="flex items-center space-x-2 sm:space-x-3 w-full sm:w-auto justify-end flex-wrap gap-y-2">
                                
                                {/* 表示切り替え */}
                                <div className="flex items-center bg-gray-100 p-1 rounded-lg shadow-inner h-10">
                                    <button onClick={() => setViewMode('10days')} className={`px-3 h-full text-sm rounded-md transition-colors ${viewMode === '10days' ? 'bg-white shadow-sm font-semibold text-gray-800' : 'text-gray-500 hover:text-gray-700'}`}>10日</button>
                                    <button onClick={() => setViewMode('graph')} className={`px-3 h-full text-sm rounded-md transition-colors ${viewMode === 'graph' ? 'bg-white shadow-sm font-semibold text-gray-800' : 'text-gray-500 hover:text-gray-700'}`}>ブロック</button>
                                </div>
                                
                                {/* 1日スクロールの移動ボタン */}
                                <div className="flex items-stretch bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm h-10">
                                    <button 
                                        onPointerDown={() => handlePointerDown('prev')}
                                        onPointerUp={handlePointerUpOrLeave}
                                        onPointerLeave={handlePointerUpOrLeave}
                                        onPointerCancel={handlePointerUpOrLeave}
                                        onContextMenu={(e) => e.preventDefault()}
                                        disabled={currentIndex <= minIndex} 
                                        className={`px-4 transition-colors flex items-center justify-center select-none ${currentIndex <= minIndex ? 'text-gray-300 cursor-not-allowed' : 'hover:bg-gray-100 text-gray-600'}`} 
                                        title="1日過去へ"
                                        style={{ touchAction: 'none' }}
                                    >
                                        <IconChevronLeft />
                                    </button>
                                    <div className="w-px bg-gray-200"></div>
                                    <button 
                                        onPointerDown={() => handlePointerDown('next')}
                                        onPointerUp={handlePointerUpOrLeave}
                                        onPointerLeave={handlePointerUpOrLeave}
                                        onPointerCancel={handlePointerUpOrLeave}
                                        onContextMenu={(e) => e.preventDefault()}
                                        disabled={currentIndex >= allDates.length - 1} 
                                        className={`px-4 transition-colors flex items-center justify-center select-none ${currentIndex >= allDates.length - 1 ? 'text-gray-300 cursor-not-allowed' : 'hover:bg-gray-100 text-gray-600'}`} 
                                        title="1日未来へ"
                                        style={{ touchAction: 'none' }}
                                    >
                                        <IconChevronRight />
                                    </button>
                                </div>
                                
                                <label className="flex items-center justify-center bg-white hover:bg-gray-50 border border-gray-200 text-gray-700 w-10 h-10 rounded-lg cursor-pointer transition-colors shadow-sm" title="フォルダ読込">
                                    <IconUpload />
                                    <input type="file" webkitdirectory="true" className="hidden" onChange={handleFileUpload} />
                                </label>
                                <button onClick={handleOpenDownloadModal} disabled={sortedData.length === 0} className={`flex items-center justify-center w-10 h-10 rounded-lg border border-gray-200 transition-colors shadow-sm ${sortedData.length === 0 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white hover:bg-gray-50 text-gray-700'}`} title="保存">
                                    <IconDownload />
                                </button>
                            </div>
                        </header>

                        <div className="bg-white shadow-sm rounded-xl overflow-hidden border border-gray-100">
                            <div className="overflow-x-auto">
                                <table className={`w-full text-left border-collapse table-fixed`}>
                                    <thead>
                                        <tr className="bg-blue-50 text-blue-900 border-b border-blue-100">
                                            {displayColumns.map((col, index) => {
                                                const widthClass = getWidthClass(col.key);
                                                
                                                // グラフのヘッダー（余白幅を取得するための ref を設定）
                                                if (col.key === 'status_graph') {
                                                    const firstDate = targetDaysGraph.length > 0 ? targetDaysGraph[0].label.replace(/\(.+\)/, '') : '';
                                                    const lastDate = targetDaysGraph.length > 0 ? targetDaysGraph[targetDaysGraph.length - 1].label.replace(/\(.+\)/, '') : '';
                                                    const daysCount = targetDaysGraph.length;
                                                    
                                                    return (
                                                        <th key={index} ref={graphCellRef} className={`px-2 py-3 text-sm font-semibold truncate ${widthClass}`}>
                                                            <div className="flex items-center justify-between w-full text-gray-800 font-semibold px-1 text-sm">
                                                                <div className="flex items-baseline space-x-1">
                                                                    <span>{firstDate}</span>
                                                                    {daysCount > 0 && <span className="text-gray-500 font-normal text-xs">（{daysCount}日間）</span>}
                                                                </div>
                                                                <span>{lastDate}</span>
                                                            </div>
                                                        </th>
                                                    );
                                                }

                                                const alignment = col.key === '氏名' ? 'text-left' : 'text-center';
                                                const isSortable = col.key === '番号' || col.key === '回数';
                                                
                                                return (
                                                    <th key={index} className={`px-2 py-3 text-sm font-semibold truncate ${widthClass} ${alignment} ${isSortable ? 'cursor-pointer hover:bg-blue-100 transition-colors select-none' : ''}`} onClick={isSortable ? () => requestSort(col.key) : undefined}>
                                                        <div className={`flex items-center ${alignment === 'text-center' ? 'justify-center' : 'justify-start'} w-full`}>
                                                            <span className={`truncate ${sortConfig.key === col.key ? 'text-blue-700 underline underline-offset-4 decoration-2' : ''}`}>{col.label}</span>
                                                        </div>
                                                    </th>
                                                );
                                            })}
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white">
                                        {sortedData.map((row, rowIndex) => (
                                            <tr key={rowIndex} className="border-b border-gray-50 hover:bg-gray-50 transition-colors">
                                                {displayColumns.map((col, colIndex) => {
                                                    const widthClass = getWidthClass(col.key);
                                                    
                                                    // グラフセル (ウィンドウ幅に合わせて動的に数を調整)
                                                    if (col.key === 'status_graph') {
                                                        const datesToRender = targetDaysGraph.map(d => d.key);
                                                        
                                                        return (
                                                            <td key={colIndex} className={`px-2 py-2 w-full text-left`}>
                                                                <div className="flex items-center space-x-[2px] w-full overflow-hidden">
                                                                    {datesToRender.map((date, i) => {
                                                                        const status = row[date];
                                                                        const isAbsent = status === '欠席' || status === '1'; // 欠席の判定
                                                                        const bgColor = isAbsent ? 'bg-red-400 border border-red-500' : 'bg-white border border-gray-200';
                                                                        
                                                                        return (
                                                                            <div 
                                                                                key={i} 
                                                                                className={`h-4 w-4 flex-shrink-0 rounded-[2px] ${bgColor}`} 
                                                                                title={`${formatLabel(date)}: ${isAbsent ? '欠席' : '出席'}`}
                                                                            ></div>
                                                                        );
                                                                    })}
                                                                </div>
                                                            </td>
                                                        );
                                                    }

                                                    // 通常のデータセル
                                                    const value = row[col.key] !== undefined ? row[col.key] : '-';
                                                    const alignment = col.key === '氏名' ? 'text-left' : 'text-center';
                                                    
                                                    if (value === "欠席") {
                                                        return (
                                                            <td key={colIndex} className={`px-2 py-2 text-sm truncate ${widthClass} ${alignment}`}>
                                                                <span className="inline-flex items-center justify-center px-2.5 py-0.5 rounded-md border border-red-300 bg-red-50 text-red-600 font-bold shadow-sm text-xs">
                                                                    {value}
                                                                </span>
                                                            </td>
                                                        );
                                                    }
                                                    
                                                    let textColor = "text-gray-800";
                                                    if (col.key === "回数") textColor = "text-gray-800 font-bold";
                                                    
                                                    return (
                                                        <td key={colIndex} className={`px-2 py-2 text-sm truncate ${widthClass} ${(col.key === '番号' || col.key === '氏名') ? 'font-medium' : ''} ${textColor} ${alignment}`}>{value}</td>
                                                    );
                                                })}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    {/* ダウンロード期間指定モーダル */}
                    {isDownloadModalOpen && (
                        <div className="fixed inset-0 bg-gray-900/40 flex items-center justify-center z-50 p-4 transition-opacity">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden">
                                <div className="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/80">
                                    <h3 className="font-bold text-gray-800">期間を指定してダウンロード</h3>
                                    <button onClick={() => setIsDownloadModalOpen(false)} className="text-gray-400 hover:text-gray-600 transition-colors">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                    </button>
                                </div>
                                <div className="p-5 flex flex-col space-y-4">
                                    <CalendarPicker 
                                        startDate={downloadStartDate}
                                        endDate={downloadEndDate}
                                        onChange={(start, end) => {
                                            setDownloadStartDate(start);
                                            setDownloadEndDate(end);
                                        }}
                                        allDates={allDates}
                                    />
                                    <div className="flex items-center justify-center space-x-2 text-sm font-medium text-gray-700 bg-gray-100/80 p-2.5 rounded-lg border border-gray-200">
                                        <span>{downloadStartDate ? formatLabel(downloadStartDate) : '-'}</span>
                                        <span className="text-gray-400">〜</span>
                                        <span>{downloadEndDate ? formatLabel(downloadEndDate) : '-'}</span>
                                    </div>
                                    <div className="pt-1">
                                        <p className="text-xs text-gray-500 bg-blue-50/50 p-2.5 rounded text-blue-800 border border-blue-100">
                                            指定した期間のデータと、その期間内の欠席回数を出力します。
                                        </p>
                                    </div>
                                </div>
                                <div className="p-4 bg-gray-50 flex justify-end space-x-3 border-t border-gray-100">
                                    <button onClick={() => setIsDownloadModalOpen(false)} className="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 transition-colors">キャンセル</button>
                                    <button onClick={executeDownload} className="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 transition-colors flex items-center shadow-sm">
                                        <IconDownload />
                                        <span className="ml-1.5">ダウンロード</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
