<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中学校データ分布バブルマップ（ベクター版）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* マップの高さを800pxに変更 */
        #map { height: 800px; width: 100%; border-radius: 0.75rem; z-index: 1; }
        .maplibregl-popup-content { border-radius: 12px; padding: 8px; }
        
        .bubble-label-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; pointer-events: none !important;
        }
        
        .school-name-label, .history-row-label, .breakdown-label, .stats-summary-label {
            font-size: 13px; font-weight: 800; color: #111827;
            text-shadow: -1.5px -1.5px 0 #fff, 1.5px -1.5px 0 #fff, -1.5px 1.5px 0 #fff, -1.5px 1.5px 0 #fff;
            white-space: nowrap;
        }
        .school-name-label { margin-bottom: 1px; }

        .hide-name .school-name-label { display: none; }
        .hide-value .value-label, 
        .hide-value .breakdown-label, 
        .hide-value .history-row-label,
        .hide-value .stats-summary-label { display: none; }

        .value-label {
            font-size: 20px; font-weight: 900;
            text-shadow: -2.5px -2.5px 0 #fff, 2.5px -2.5px 0 #fff, -2.5px 2.5px 0 #fff, -2.5px 2.5px 0 #fff;
            line-height: 1; margin: 2px 0;
        }
        
        .breakdown-label { margin-top: 2px; letter-spacing: -0.01em; }
        .stats-summary-label { display: flex; gap: 5px; margin-top: 1px; }

        .custom-popup .leaflet-popup-content-wrapper { border-radius: 12px; padding: 4px; }
        #loading-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 9999; align-items: center; justify-content: center; flex-direction: column;
        }
        .stat-display { display: flex; align-items: center; gap: 1.5rem; }
        .stat-item { display: flex; flex-direction: column; }
        .yuge-conditions.is-disabled { opacity: 0.4; }
        .yuge-conditions button:disabled { cursor: not-allowed; }
        .pr-legend {
            display: none;
            min-width: 134px;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.18);
            color: #374151;
            font-size: 11px;
            font-weight: 700;
            line-height: 1.5;
        }
        .pr-legend.is-visible { display: block; }
        .pr-legend-title { margin-bottom: 4px; color: #111827; font-weight: 900; }
        .pr-legend-row { display: flex; align-items: center; gap: 6px; }
        .pr-legend-line { width: 20px; border-top-style: solid; border-radius: 999px; }
    </style>
</head>
<body class="bg-white min-h-screen text-gray-800 font-sans">
    <div id="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-gray-900 mb-4"></div>
        <p id="loading-text" class="text-sm font-bold text-gray-600 italic">データを読み込んでいます...</p>
    </div>

    <div class="max-w-[1600px] mx-auto p-4 md:p-8">
        <header class="mb-6 flex flex-col md:flex-row justify-between items-end gap-6">
            <div class="w-full md:w-auto">
                <h1 class="text-2xl font-black text-gray-900 tracking-tight mb-3">中学校別データ</h1>
                <div id="current-mode-desc" class="stat-display"></div>
            </div>
            <div id="drop-zone" class="relative group bg-gray-50 p-2 rounded-lg border border-gray-200 w-full md:w-48 cursor-pointer text-center hover:bg-gray-100 transition-all">
                <input type="file" id="file-input" accept=".xlsx, .xls, .csv" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Excelファイルを読込</p>
            </div>
        </header>

        <div id="controls" class="mb-6 flex flex-col items-start gap-3 border-t border-gray-100 pt-6">
            <div class="flex items-center gap-3 w-full">
                <span class="text-[10px] font-bold text-gray-400 uppercase w-16 shrink-0">地区</span>
                <div id="district-btn-group" class="flex flex-wrap items-center gap-1.5 bg-gray-50 p-1 rounded-lg w-fit">
                    <!-- JSで動的にボタンを追加 -->
                </div>
            </div>

            <div class="flex items-center gap-3 w-full">
                <span class="text-[10px] font-bold text-gray-400 uppercase w-24 shrink-0">表示するデータ</span>
                <div class="flex flex-wrap items-center gap-4">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" id="toggle-names" onchange="refreshUI(false)" checked class="w-3.5 h-3.5 rounded border-gray-300 text-gray-900 focus:ring-gray-500">
                        <span class="text-[10px] font-bold text-gray-500">学校名</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" id="toggle-students" onchange="refreshUI(false)" checked class="w-3.5 h-3.5 rounded border-gray-300 text-emerald-500 focus:ring-emerald-500">
                        <span class="text-[10px] font-bold text-gray-500">中学校3年生</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" id="toggle-yuge" onchange="refreshUI(false)" checked class="w-3.5 h-3.5 rounded border-gray-300 text-emerald-500 focus:ring-emerald-500">
                        <span class="text-[10px] font-bold text-gray-500">弓削商船</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" id="toggle-pr" onchange="refreshUI(false)" checked class="w-3.5 h-3.5 rounded border-gray-300 text-emerald-500 focus:ring-emerald-500">
                        <span class="text-[10px] font-bold text-gray-500">PR回数</span>
                    </label>
                </div>
            </div>

            <div id="yuge-conditions" class="yuge-conditions flex flex-col items-start gap-3 w-full">
                <div class="flex items-center gap-3 w-full">
                    <span class="text-[10px] font-bold text-gray-400 uppercase w-16 shrink-0">学年</span>
                    <div id="year-btn-group" class="flex flex-wrap items-center gap-1.5 bg-gray-50 p-1 rounded-lg w-fit">
                        <button onclick="updateYear('total')" id="year-btn-total" class="year-btn px-3 py-1.5 text-[11px] font-bold rounded transition-all bg-emerald-500 text-white shadow-sm">全学年</button>
                        <button onclick="updateYear(0)" id="year-btn-0" class="year-btn px-3 py-1.5 text-[11px] font-bold rounded transition-all bg-white text-gray-400 border border-gray-100 hover:bg-gray-50">１年</button>
                        <button onclick="updateYear(1)" id="year-btn-1" class="year-btn px-3 py-1.5 text-[11px] font-bold rounded transition-all bg-white text-gray-400 border border-gray-100 hover:bg-gray-50">２年</button>
                        <button onclick="updateYear(2)" id="year-btn-2" class="year-btn px-3 py-1.5 text-[11px] font-bold rounded transition-all bg-white text-gray-400 border border-gray-100 hover:bg-gray-50">３年</button>
                        <button onclick="updateYear(3)" id="year-btn-3" class="year-btn px-3 py-1.5 text-[11px] font-bold rounded transition-all bg-white text-gray-400 border border-gray-100 hover:bg-gray-50">４年</button>
                        <button onclick="updateYear(4)" id="year-btn-4" class="year-btn px-3 py-1.5 text-[11px] font-bold rounded transition-all bg-white text-gray-400 border border-gray-100 hover:bg-gray-50">５年</button>
                    </div>
                </div>
                <div class="flex items-center gap-3 w-full">
                    <span class="text-[10px] font-bold text-gray-400 uppercase w-16 shrink-0">学科</span>
                    <div class="flex flex-wrap items-center gap-1.5 bg-gray-50 p-1 rounded-lg w-fit">
                        <button onclick="updateDisplayMode('sci')" id="btn-sci" class="mode-btn px-3 py-1.5 text-[11px] font-bold rounded transition-all bg-orange-500 text-white">SCI</button>
                        <button onclick="updateDisplayMode('s')" id="btn-s" class="mode-btn px-3 py-1.5 text-[11px] font-bold rounded transition-all bg-white text-gray-400 border border-gray-100">S</button>
                        <button onclick="updateDisplayMode('c')" id="btn-c" class="mode-btn px-3 py-1.5 text-[11px] font-bold rounded transition-all bg-white text-gray-400 border border-gray-100">C</button>
                        <button onclick="updateDisplayMode('i')" id="btn-i" class="mode-btn px-3 py-1.5 text-[11px] font-bold rounded transition-all bg-white text-gray-400 border border-gray-100">I</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="map" class="border border-gray-200 bg-gray-50 mb-8 shadow-sm"></div>

    </div>

    <script>
        let schoolData = [];
        let map;
        let mapMarkers = [];
        const CARTO_API_KEY = 'YOUR_CARTO_API_KEY';
        const CARTO_STYLE_URL = 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json';
        let currentMode = 'sci';
        let currentYearIdx = 'total';
        let currentDistrict = 'all'; // 現在選択されている地区
        
        const AUTO_LOAD_FILE = '近隣中学校.xlsx'; 
        const themeColors = {
            students: { border: '#10b981', fill: '#34d399', bg: 'bg-emerald-500', text: 'text-emerald-700', label: '中学3年生' },
            s: { border: '#06b6d4', fill: '#67e8f9', bg: 'bg-cyan-500', text: 'text-cyan-700', label: 'S' },
            c: { border: '#8b5cf6', fill: '#c4b5fd', bg: 'bg-violet-500', text: 'text-violet-700', label: 'C' },
            i: { border: '#f472b6', fill: '#fbcfe8', bg: 'bg-pink-500', text: 'text-pink-700', label: 'I' },
            sci: { border: '#f97316', fill: '#fdba74', bg: 'bg-orange-500', text: 'text-orange-700', label: 'SCI' }
        };

        async function getCoords(address) {
            try {
                const res = await fetch(`https://msearch.gsi.go.jp/address-search/AddressSearch?q=${encodeURIComponent(address)}`);
                const json = await res.json();
                return json.length > 0 ? { lat: json[0].geometry.coordinates[1], lng: json[0].geometry.coordinates[0] } : null;
            } catch { return null; }
        }

        async function processWorkbook(arrayBuffer) {
            const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const json = XLSX.utils.sheet_to_json(firstSheet);
            const processed = [];
            for (const rawRow of json) {
                // ヘッダー名に含まれるスペースを除去し、安全に数値化する
                const row = {};
                Object.keys(rawRow).forEach(key => row[key.trim()] = rawRow[key]);
                const p = (val) => parseInt(val) || 0;

                const hS = [p(row['R8_S']), p(row['R7_S']), p(row['R6_S']), p(row['R5_S']), p(row['R4_S'])];
                const hC = [
                    p(row['R8_C']) + p(row['R8_M']) + p(row['R8_C/M']),
                    p(row['R7_C']) + p(row['R7_M']) + p(row['R7_C/M']),
                    p(row['R6_C']) + p(row['R6_M']) + p(row['R6_C/M']),
                    p(row['R5_C']) + p(row['R5_M']) + p(row['R5_C/M']),
                    p(row['R4_C']) + p(row['R4_M']) + p(row['R4_C/M'])
                ];
                const hI = [p(row['R8_I']), p(row['R7_I']), p(row['R6_I']), p(row['R5_I']), p(row['R4_I'])];
                const hSCI = hS.map((val, idx) => val + hC[idx] + hI[idx]);
                const history = {
                    s: hS, c: hC, i: hI, sci: hSCI,
                    s_total: hS.reduce((a, b) => a + b, 0),
                    c_total: hC.reduce((a, b) => a + b, 0),
                    i_total: hI.reduce((a, b) => a + b, 0),
                    sci_total: hSCI.reduce((a, b) => a + b, 0)
                };
                
                // エクセルデータの「緯度」「経度」を取得
                let lat = parseFloat(row['緯度']);
                let lng = parseFloat(row['経度']);
                
                // データに緯度経度がない場合のみAPIで取得する（大幅な時間短縮）
                if (isNaN(lat) || isNaN(lng)) {
                    const coords = await getCoords(row['住所']);
                    if (coords) {
                        lat = coords.lat;
                        lng = coords.lng;
                    }
                }

                // 最終的に緯度経度が取得できた場合のみデータに追加
                if (!isNaN(lat) && !isNaN(lng)) {
                    const rawPr = row['PR'];
                    const prValue = rawPr === undefined || rawPr === null || String(rawPr).trim() === '' ? null : Number(rawPr);
                    processed.push({
                        district: row['地区'], name: row['学校名'], address: row['住所'],
                        students: parseInt(row['中学3年生'] || 0), lat: lat, lng: lng,
                        pr: Number.isFinite(prValue) ? prValue : null,
                        history, s_total: history.s_total, c_total: history.c_total,
                        i_total: history.i_total, sci_total: history.sci_total
                    });
                }
            }
            return processed;
        }

        async function loadInitialData() {
            try {
                document.getElementById('loading-overlay').style.display = 'flex';
                const response = await fetch(`${AUTO_LOAD_FILE}?v=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error('File not found');
                const buffer = await response.arrayBuffer();
                schoolData = await processWorkbook(buffer);
                initUI();
            } catch (err) {
                document.getElementById('current-mode-desc').innerHTML = `
                    <div class="stat-item">
                        <span class="text-[15px] font-bold text-gray-400 uppercase tracking-widest">表示中</span>
                        <span class="text-sm font-black text-gray-900">0 <span class="text-[15px] font-bold text-gray-400">校</span></span>
                    </div>
                    <div class="stat-item">
                        <span class="text-xs text-gray-400 mt-2">Excelファイルを読み込んでください</span>
                    </div>
                `;
            } finally {
                document.getElementById('loading-overlay').style.display = 'none';
            }
        }

        function initUI() {
            updateDistrictButtons();
            refreshUI(true);
        }

        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('loading-overlay').style.display = 'flex';
            const reader = new FileReader();
            reader.onload = async (event) => {
                schoolData = await processWorkbook(event.target.result);
                initUI();
                document.getElementById('loading-overlay').style.display = 'none';
            };
            reader.readAsArrayBuffer(file);
        });

        // 動的に地区ボタンを生成・更新する関数
        function updateDistrictButtons() {
            const rawDistricts = schoolData ? [...new Set(schoolData.map(s => s.district))] : [];
            
            // 指定された並び順の定義
            const order = ["福山市", "尾道市", "三原市", "松山市", "今治市", "上島町"];
            const allDistricts = [...new Set([...order, ...rawDistricts])];
            
            const districts = allDistricts.sort((a, b) => {
                const indexA = order.indexOf(a);
                const indexB = order.indexOf(b);
                // 両方とも指定リストにある場合はその順序に従う
                if (indexA !== -1 && indexB !== -1) return indexA - indexB;
                // aだけが指定リストにある場合
                if (indexA !== -1) return -1;
                // bだけが指定リストにある場合
                if (indexB !== -1) return 1;
                // どちらも指定リストにない場合は文字コード順（あいうえお順）
                return a.localeCompare(b, 'ja');
            });

            const container = document.getElementById('district-btn-group');
            
            let html = `<button onclick="updateDistrict('all')" id="dist-btn-all" class="dist-btn px-3 py-1.5 text-[11px] font-bold rounded transition-all ${currentDistrict === 'all' ? 'bg-emerald-500 text-white shadow-sm' : 'bg-white text-gray-400 border border-gray-100 hover:bg-gray-50'}">すべて</button>`;
            
            districts.forEach((d, i) => {
                html += `<button onclick="updateDistrict('${d}')" id="dist-btn-${i}" class="dist-btn px-3 py-1.5 text-[11px] font-bold rounded transition-all ${currentDistrict === d ? 'bg-emerald-500 text-white shadow-sm' : 'bg-white text-gray-400 border border-gray-100 hover:bg-gray-50'}">${d}</button>`;
            });
            container.innerHTML = html;
        }

        // 地区ボタンがクリックされた時の処理
        function updateDistrict(district) {
            currentDistrict = district;
            updateDistrictButtons(); // ボタンのスタイル（色）を再描画して更新
            refreshUI(true);
        }

        function updateYear(yearVal) {
            currentYearIdx = yearVal;
            document.querySelectorAll('.year-btn').forEach(btn => {
                const isSelected = btn.id === `year-btn-${yearVal}`;
                btn.className = "year-btn px-3 py-1.5 text-[11px] font-bold rounded transition-all " + 
                    (isSelected ? "bg-emerald-500 text-white shadow-sm" : "bg-white text-gray-400 border border-gray-100 hover:bg-gray-50");
            });
            refreshUI(false);
        }

        function updateDisplayMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                const btnId = btn.id.replace('btn-', '');
                const theme = themeColors[btnId];
                btn.className = "mode-btn px-3 py-1.5 text-[11px] font-bold rounded transition-all " + 
                    (btnId === mode ? `${theme.bg} text-white` : "bg-white text-gray-400 border border-gray-100");
            });
            refreshUI(false);
        }

        function setInitialState() {
            currentDistrict = 'all';
            currentYearIdx = 'total';
            currentMode = 'sci';
            document.getElementById('toggle-names').checked = true;
            document.getElementById('toggle-students').checked = true;
            document.getElementById('toggle-yuge').checked = true;
            document.getElementById('toggle-pr').checked = true;
        }

        function refreshUI(shouldFitBounds = false) {
            // 選択された地区変数を使用してフィルタリング
            const filtered = currentDistrict === 'all' ? schoolData : schoolData.filter(s => s.district === currentDistrict);
            const showStudents = document.getElementById('toggle-students').checked;
            const showYuge = document.getElementById('toggle-yuge').checked;
            const yugeConditions = document.getElementById('yuge-conditions');
            yugeConditions.classList.toggle('is-disabled', !showYuge);
            yugeConditions.querySelectorAll('button').forEach(button => { button.disabled = !showYuge; });

            let studentTotal = 0;
            let yugeTotal = 0;
            const activeData = [];
            
            if (schoolData && schoolData.length > 0) {
                filtered.forEach(s => {
                    const selectedYugeValue = currentYearIdx === 'total'
                        ? s.history[`${currentMode}_total`]
                        : s.history[currentMode][currentYearIdx];
                    studentTotal += s.students;
                    yugeTotal += selectedYugeValue;
                    if ((showStudents && s.students >= 0) || (showYuge && selectedYugeValue > 0)) {
                        activeData.push(s);
                    }
                });
            }

            const stats = [
                `<div class="stat-item"><span class="text-[15px] font-bold text-gray-400 uppercase tracking-widest">表示中</span><span class="text-sm font-black text-gray-900">${activeData.length} <span class="text-[15px] font-bold text-gray-400">校</span></span></div>`
            ];
            if (showStudents) {
                stats.push(`<div class="stat-item"><span class="text-[15px] font-bold text-gray-400 uppercase tracking-widest">中学校3年生</span><span class="text-sm font-black text-gray-900">${studentTotal.toLocaleString()} <span class="text-[15px] font-bold text-gray-400">人</span></span></div>`);
            }
            if (showYuge) {
                stats.push(`<div class="stat-item"><span class="text-[15px] font-bold text-gray-400 uppercase tracking-widest">弓削商船</span><span class="text-sm font-black text-gray-900">${yugeTotal.toLocaleString()} <span class="text-[15px] font-bold text-gray-400">人</span></span></div>`);
            }

            document.getElementById('current-mode-desc').innerHTML = stats.join('');

            if (!schoolData || schoolData.length === 0) return;

            renderMap(filtered, shouldFitBounds);
        }

        function renderMap(data, shouldFitBounds) {
            mapMarkers.forEach(marker => marker.remove());
            mapMarkers = [];
            const showNames = document.getElementById('toggle-names').checked;
            const showValues = true;
            const showStudents = document.getElementById('toggle-students').checked;
            const showYuge = document.getElementById('toggle-yuge').checked;
            const showPr = document.getElementById('toggle-pr').checked;
            document.getElementById('pr-legend')?.classList.toggle('is-visible', showPr);
            let labelClasses = "bubble-label-container";
            if (!showNames) labelClasses += " hide-name";
            if (!showValues) labelClasses += " hide-value";
            const features = [];

            data.forEach(s => {
                const curYear = currentYearIdx === 'total' ? 'total' : currentYearIdx;
                let valS, valC, valI, valSCI;
                if (curYear === 'total') {
                    valS = s.history.s_total; valC = s.history.c_total; valI = s.history.i_total; valSCI = s.history.sci_total;
                } else {
                    valS = s.history.s[curYear]; valC = s.history.c[curYear]; valI = s.history.i[curYear]; valSCI = s.history.sci[curYear];
                }

                const selectedYugeValue = currentMode === 'sci' ? valSCI : currentMode === 's' ? valS : currentMode === 'c' ? valC : valI;
                const showBubble = showStudents || (showYuge && selectedYugeValue > 0);

                const bubbleCalculationValue = showStudents ? s.students : selectedYugeValue;
                const baseMultiplier = showStudents ? 1.0 : 4.0;
                const theme = showStudents ? themeColors.students : themeColors[currentMode];
                let strokeColor = theme.border;
                let strokeWidth = 3;
                if (showPr && s.pr > 0) {
                    if (s.pr >= 5) {
                        strokeColor = '#ef4444';
                    } else if (s.pr >= 3) {
                        strokeColor = '#f59e0b';
                    } else {
                        strokeColor = '#2563eb';
                    }
                }
                // Leaflet版の半径（メートル）を、初期ズーム10でのMapLibreのピクセル半径へ換算する。
                const metersPerPixelAtZoom10 = 156543.03392 * Math.cos(s.lat * Math.PI / 180) / Math.pow(2, 10);
                const radius = Math.sqrt(bubbleCalculationValue || 0.5) * 180 * baseMultiplier / metersPerPixelAtZoom10;
                const studentLabel = showStudents ? `<div class="value-label" style="color:${themeColors.students.border}">${s.students}</div>` : "";
                const yugeLabel = !showYuge ? "" : currentMode === 'sci' ? `
                    <div class="breakdown-label">S:${valS} C:${valC} I:${valI}</div>
                    <div class="stats-summary-label">合計:${valSCI}</div>` :
                    `<div class="breakdown-label">${currentMode.toUpperCase()}:${selectedYugeValue}</div>`;
                const labelHtml = `<div class="${labelClasses}">
                    <div class="school-name-label">${s.name}${showPr && s.pr !== null ? `（${s.pr}）` : ''}</div>
                    ${studentLabel}
                    ${yugeLabel}
                </div>`;

                const studentPopup = showStudents ? `<div><div class="text-[8px] text-gray-400 font-bold uppercase">中3生</div><div class="text-xs font-black text-emerald-600">${s.students}</div></div>` : "";
                const yugePrimaryPopup = !showYuge ? "" : currentMode === 'sci' ?
                    `<div><div class="text-[8px] text-gray-400 font-bold uppercase">SCI</div><div class="text-xs font-black text-orange-600">${valSCI}</div></div>` :
                    `<div><div class="text-[8px] text-gray-400 font-bold">${currentMode.toUpperCase()}</div><div class="text-xs font-black ${theme.text}">${selectedYugeValue}</div></div>`;
                const yugeBreakdownPopup = !showYuge || currentMode !== 'sci' ? "" : `
                    <div><div class="text-[8px] text-gray-400 font-bold">S</div><div class="text-xs font-black text-blue-600">${valS}</div></div>
                    <div><div class="text-[8px] text-gray-400 font-bold">C</div><div class="text-xs font-black text-violet-600">${valC}</div></div>
                    <div><div class="text-[8px] text-gray-400 font-bold">I</div><div class="text-xs font-black text-pink-600">${valI}</div></div>`;
                const prPopup = showPr && s.pr !== null ?
                    `<div><div class="text-[8px] text-gray-400 font-bold uppercase">PR</div><div class="text-xs font-black text-gray-900">${s.pr}</div></div>` : "";
                const prPopupSlot = currentMode === 'sci' ? (prPopup || '<div aria-hidden="true"></div>') : prPopup;

                const popup = `
                    <div class="p-2 custom-popup min-w-[200px]">
                        <div class="font-black text-sm mb-2 border-b pb-1 text-gray-900">${s.name}</div>
                        <div class="grid grid-cols-3 gap-2 text-center">${studentPopup}${yugePrimaryPopup}${prPopupSlot}${yugeBreakdownPopup}</div>
                    </div>
                `;

                if (showBubble) {
                    features.push({
                        type: 'Feature',
                        geometry: { type: 'Point', coordinates: [s.lng, s.lat] },
                        properties: { radius, color: strokeColor, strokeWidth, fill: theme.fill, popup }
                    });
                }

                if (showNames || showStudents || showYuge) {
                    const markerElement = document.createElement('div');
                    markerElement.innerHTML = labelHtml;
                    const marker = new maplibregl.Marker({ element: markerElement, anchor: 'center' })
                        .setLngLat([s.lng, s.lat])
                        .setPopup(new maplibregl.Popup({ offset: 12 }).setHTML(popup))
                        .addTo(map);
                    mapMarkers.push(marker);
                }
            });

            map.getSource('school-bubbles').setData({ type: 'FeatureCollection', features });
            if (shouldFitBounds) {
                if (features.length > 0) {
                    const bounds = features.reduce((result, feature) => result.extend(feature.geometry.coordinates), new maplibregl.LngLatBounds());
                    map.fitBounds(bounds, { padding: 40 });
                }
            }
        }

        window.onload = () => {
            const appendCartoKey = url => {
                if (CARTO_API_KEY === 'YOUR_CARTO_API_KEY' || !url.includes('cartocdn.com')) return url;
                return `${url}${url.includes('?') ? '&' : '?'}key=${encodeURIComponent(CARTO_API_KEY)}`;
            };

            map = new maplibregl.Map({
                container: 'map',
                style: appendCartoKey(CARTO_STYLE_URL),
                center: [133.20, 34.40],
                zoom: 10,
                maxZoom: 20,
                transformRequest: (url) => ({ url: appendCartoKey(url) })
            });
            map.addControl(new maplibregl.NavigationControl(), 'bottom-right');

            map.on('load', () => {
                map.addSource('school-bubbles', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
                map.addLayer({
                    id: 'school-bubbles',
                    type: 'circle',
                    source: 'school-bubbles',
                    paint: {
                        'circle-radius': ['get', 'radius'],
                        'circle-color': ['get', 'fill'],
                        'circle-opacity': 0.4,
                        'circle-stroke-width': ['get', 'strokeWidth'],
                        'circle-stroke-color': ['get', 'color'],
                        'circle-stroke-opacity': 1
                    }
                });
                const prLegend = {
                    onAdd() {
                        const container = document.createElement('div');
                        container.id = 'pr-legend';
                        container.className = 'maplibregl-ctrl pr-legend';
                        container.innerHTML = `
                            <div class="pr-legend-title">PR回数</div>
                            <div class="pr-legend-row"><span class="pr-legend-line" style="border-color:#2563eb;border-width:3px"></span>1〜2回</div>
                            <div class="pr-legend-row"><span class="pr-legend-line" style="border-color:#f59e0b;border-width:3px"></span>3〜4回</div>
                            <div class="pr-legend-row"><span class="pr-legend-line" style="border-color:#ef4444;border-width:3px"></span>5回以上</div>`;
                        return container;
                    },
                    onRemove() { document.getElementById('pr-legend')?.remove(); }
                };
                map.addControl(prLegend, 'bottom-left');
                const updateBubbleScale = () => {
                    const zoomScale = Math.pow(2, map.getZoom() - 10);
                    map.setPaintProperty('school-bubbles', 'circle-radius', ['*', ['get', 'radius'], zoomScale]);
                };
                map.on('zoom', updateBubbleScale);
                map.on('click', 'school-bubbles', event => {
                    const feature = event.features[0];
                    new maplibregl.Popup({ offset: 12 })
                        .setLngLat(feature.geometry.coordinates)
                        .setHTML(feature.properties.popup)
                        .addTo(map);
                });
                map.on('mouseenter', 'school-bubbles', () => { map.getCanvas().style.cursor = 'pointer'; });
                map.on('mouseleave', 'school-bubbles', () => { map.getCanvas().style.cursor = ''; });

                setInitialState();
                updateDistrictButtons();
                refreshUI(false);
                loadInitialData();
            });
        };
    </script>
</body>
</html>
