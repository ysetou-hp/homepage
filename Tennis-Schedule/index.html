    }

</head>

        responses: { 'u1': { status: 'attending', comment: '' }, 'u5': { status: 'absent', comment: '' }, 'u9': { status: 'attending', comment: '' } }

        responses: { 'u1': { status: 'attending', comment: '' }, 'u2': { status: 'attending', comment: '' }, 'u3': { status: 'attending', comment: '' }, 'u4': { status: 'attending', comment: '' }, 'u5': { status: 'attending', comment: '' }, 'u6': { status: 'attending', comment: '' } }
      },
      {

        responses: { 'u7': { status: 'attending', comment: '' }, 'u8': { status: 'attending', comment: '' }, 'u11': { status: 'attending', comment: '' } }
      },

      },
      {

        responses: { 'u2': { status: 'absent', comment: '' }, 'u9': { status: 'attending', comment: '' } }
      }
    ];

    const mergeSize = (cls, defaultSize) => cls ? (cls.includes('w-') ? cls : `${defaultSize} ${cls}`) : defaultSize;
    const IconCheck = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={mergeSize(className, "w-5 h-5")}><polyline points="20 6 9 17 4 12"></polyline></svg>;
    const IconX = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={mergeSize(className, "w-5 h-5")}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
    const IconChevronRight = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={mergeSize(className, "w-4 h-4")}><polyline points="9 18 15 12 9 6"></polyline></svg>;
    const IconChevronLeft = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={mergeSize(className, "w-4 h-4")}><polyline points="15 18 9 12 15 6"></polyline></svg>;
    const IconPlus = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={mergeSize(className, "w-6 h-6")}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const IconDots = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={mergeSize(className, "w-5 h-5")}><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>;
    const IconClose = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={mergeSize(className, "w-5 h-5")}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
    const IconList = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={mergeSize(className, "w-6 h-6")}><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>;
    const IconCalendar = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={mergeSize(className, "w-6 h-6")}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
    const IconUser = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={mergeSize(className, "w-6 h-6")}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>;
    const IconMinus = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={mergeSize(className, "w-5 h-5")}><line x1="6" y1="12" x2="18" y2="12"></line></svg>;

    const HOLIDAYS = [
      '2026-01-01', '2026-01-12', '2026-02-11', '2026-02-23', '2026-03-20', '2026-04-29',
      '2026-05-03', '2026-05-04', '2026-05-05', '2026-05-06', '2026-07-20', '2026-08-11',
      '2026-09-21', '2026-09-22', '2026-09-23', '2026-10-12', '2026-11-03', '2026-11-23',
      '2027-01-01', '2027-01-11', '2027-02-11', '2027-02-23', '2027-03-21', '2027-03-22'
    ];

    const Toast = ({ message, visible }) => {
      if (!visible) return null;
      return (
        <div className="fixed top-4 left-0 right-0 z-50 flex justify-center pointer-events-none px-4">
          <div className="bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg text-sm font-medium animate-fade-in-down max-w-[430px] w-full text-center mx-auto">
            {message}
          </div>
        </div>
      );
    };

    const ParticipantsBottomSheet = ({ isOpen, onClose, event, users }) => {
      if (!isOpen || !event) return null;

      const responses = event.responses || {};
      const attending = [];
      const absent = [];
      const unanswered = [];

      users.forEach(user => {
        const res = responses[user.id];
        if (!res || res.status === 'unanswered') {
          unanswered.push(user);
        } else if (res.status === 'attending') {
          attending.push({ ...user, comment: res.comment });
        } else if (res.status === 'absent') {
          absent.push({ ...user, comment: res.comment });
        }
      });

      return (
        <>
          <div className="fixed inset-0 bg-black/40 z-40 transition-opacity" onClick={onClose} />
          <div className="fixed inset-x-0 bottom-0 z-50 bg-white rounded-t-3xl shadow-xl transform transition-transform max-h-[85vh] flex flex-col max-w-[430px] mx-auto">
            <div className="flex justify-center p-3" onClick={onClose}>
              <div className="w-12 h-1.5 bg-gray-300 rounded-full"></div>
            </div>
            <div className="px-6 pb-4 border-b border-gray-100 flex justify-between items-center shrink-0">
              <div>
                <h2 className="text-lg font-bold text-gray-800">{event.dateStr}の参加者</h2>
                <p className="text-sm text-gray-500">{attending.length}人が参加予定</p>
              </div>
              <button onClick={onClose} className="p-2 bg-gray-100 rounded-full text-gray-500 hover:bg-gray-200">
                <IconClose className="w-5 h-5" />
              </button>
            </div>
            
            <div className="overflow-y-auto px-6 py-4 flex-1">
              <div className="mb-6">
                <div className="flex items-center gap-2 mb-3">
                  <span className="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-md text-xs font-bold">参加 {attending.length}</span>
                </div>
                {attending.length > 0 ? (
                  <ul className="space-y-3">
                    {attending.map(u => (
                      <li key={u.id} className="flex flex-col">
                        <div className="flex items-center gap-2 text-gray-800 font-medium">
                          <IconCheck className="w-4 h-4 text-emerald-500" />
                          {u.name}
                        </div>
                        {u.comment && <span className="text-sm text-gray-500 ml-6 break-words">{u.comment}</span>}
                      </li>
                    ))}
                  </ul>
                ) : <p className="text-sm text-gray-400">なし</p>}
              </div>

              <div className="mb-6">
                <div className="flex items-center gap-2 mb-3">
                  <span className="bg-rose-100 text-rose-700 px-2 py-0.5 rounded-md text-xs font-bold">不参加 {absent.length}</span>
                </div>
                {absent.length > 0 ? (
                  <ul className="space-y-3">
                    {absent.map(u => (
                      <li key={u.id} className="flex flex-col">
                        <div className="flex items-center gap-2 text-gray-500 font-medium">
                          <IconX className="w-4 h-4 text-rose-400" />
                          {u.name}
                        </div>
                        {u.comment && <span className="text-sm text-gray-400 ml-6 break-words">{u.comment}</span>}
                      </li>
                    ))}
                  </ul>
                ) : <p className="text-sm text-gray-400">なし</p>}
              </div>

              <div>
                <div className="flex items-center gap-2 mb-3">
                  <span className="bg-gray-50 text-gray-500 px-2 py-0.5 rounded-md text-xs font-bold border border-gray-200">未回答 {unanswered.length}</span>
                </div>
                {unanswered.length > 0 ? (
                  <div className="flex flex-wrap gap-2">
                    {unanswered.map(u => (
                       <span key={u.id} className="text-sm text-gray-500 bg-gray-50 px-2 py-1 rounded-md border border-gray-100">{u.name}</span>
                    ))}
                  </div>
                ) : <p className="text-sm text-gray-400">なし</p>}
              </div>
              
              <div className="h-8"></div>
            </div>
          </div>
        </>
      );
    };

    const EventFormModal = ({ isOpen, onClose, onSave, eventToEdit }) => {
      const [formData, setFormData] = useState({
        dates: [], timeStr: '10:00〜11:00', courts: ['A', 'B'], memo: ''
      });
      const [currentMonth, setCurrentMonth] = useState(new Date());

      useEffect(() => {
        if (eventToEdit) {
          setFormData({ 
            dates: [eventToEdit.date], 
            timeStr: eventToEdit.timeStr,
            courts: eventToEdit.courts || [],
            memo: eventToEdit.memo || ''
          });
          setCurrentMonth(new Date(eventToEdit.date));
        } else {
          setFormData({
            dates: [], timeStr: '10:00〜11:00', courts: ['A', 'B'], memo: ''
          });
          setCurrentMonth(new Date());
        }
      }, [eventToEdit, isOpen]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (formData.dates.length === 0) return;
        onSave(formData);
      };

      const toggleDate = (dateString) => {
        if (eventToEdit) {
          setFormData({...formData, dates: [dateString]});
        } else {
          let newDates;
          if (formData.dates.includes(dateString)) {
            newDates = formData.dates.filter(d => d !== dateString);
          } else {
            newDates = [...formData.dates, dateString].sort();
          }
          setFormData({...formData, dates: newDates});
        }
      };

      const removeDate = (dateToRemove) => {
        setFormData({...formData, dates: formData.dates.filter(d => d !== dateToRemove)});
      };

      const getDayStr = (dateStr) => {
        const days = ['日', '月', '火', '水', '木', '金', '土'];
        return days[new Date(dateStr).getDay()];
      };

      const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
      const firstDayOfMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1).getDay();
      const daysInMonth = getDaysInMonth(currentMonth.getFullYear(), currentMonth.getMonth());
      
      const days = [];
      for (let i = 0; i < firstDayOfMonth; i++) days.push(null);
      for (let i = 1; i <= daysInMonth; i++) {
        days.push(new Date(currentMonth.getFullYear(), currentMonth.getMonth(), i));
      }

      return (
        <div className="fixed inset-0 bg-white z-50 flex flex-col max-w-[430px] mx-auto shadow-2xl">
          <div className="flex items-center justify-between p-4 border-b border-gray-100 shrink-0">
            <h2 className="text-lg font-bold text-gray-800">{eventToEdit ? '予定を編集' : '予定を追加'}</h2>
            <button onClick={onClose} className="p-2 bg-gray-100 rounded-full text-gray-500">
              <IconClose className="w-5 h-5" />
            </button>
          </div>
          
          <form onSubmit={handleSubmit} className="flex-1 overflow-y-auto p-6 space-y-6">
            <div>
              <label className="block text-sm font-bold text-gray-700 mb-2">
                日付 {eventToEdit ? '' : <span className="text-emerald-600 ml-2 font-normal">(複数選択可)</span>}
              </label>
              
              <div className="bg-gray-50 border border-gray-200 rounded-2xl p-4 mb-4 select-none">
                <div className="flex justify-between items-center mb-3">
                  <button type="button" onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1))} className="p-2 text-gray-500 hover:bg-gray-200 rounded-full transition-colors"><IconChevronLeft className="w-5 h-5"/></button>
                  <span className="font-bold text-gray-800">{currentMonth.getFullYear()}年 {currentMonth.getMonth() + 1}月</span>
                  <button type="button" onClick={() => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1))} className="p-2 text-gray-500 hover:bg-gray-200 rounded-full transition-colors"><IconChevronRight className="w-5 h-5"/></button>
                </div>
                <div className="grid grid-cols-7 gap-1 text-center text-xs font-bold mb-2">
                  <div className="text-rose-400">日</div><div className="text-gray-400">月</div><div className="text-gray-400">火</div><div className="text-gray-400">水</div><div className="text-gray-400">木</div><div className="text-gray-400">金</div><div className="text-blue-400">土</div>
                </div>
                <div className="grid grid-cols-7 gap-1">
                  {days.map((d, i) => {
                    if (!d) return <div key={i}></div>;
                    const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                    const isSelected = formData.dates.includes(dateStr);
                    return (
                      <button
                        key={i}
                        type="button"
                        onClick={() => toggleDate(dateStr)}
                        className={`h-10 w-full rounded-xl flex items-center justify-center text-sm font-bold transition-colors active:scale-90 ${
                          isSelected 
                          ? 'bg-emerald-500 text-white shadow-md shadow-emerald-200' 
                          : 'text-gray-700 hover:bg-gray-200 bg-white border border-gray-100'
                        }`}
                      >
                        {d.getDate()}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="flex flex-wrap gap-2">
                {formData.dates.map(d => {
                  const dObj = new Date(d);
                  const display = `${dObj.getMonth() + 1}月${dObj.getDate()}日（${getDayStr(d)}）`;
                  return (
                    <div key={d} className="flex items-center gap-1 bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-lg border border-emerald-200">
                      <span className="text-sm font-bold">{display}</span>
                      {!eventToEdit && (
                        <button type="button" onClick={() => removeDate(d)} className="p-0.5 hover:bg-emerald-100 rounded-full">
                          <IconClose className="w-3.5 h-3.5" />
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            <div>
              <label className="block text-sm font-bold text-gray-700 mb-2">時間</label>
              <input 
                type="text" 
                value={formData.timeStr} 
                onChange={e => setFormData({...formData, timeStr: e.target.value})}
                className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800 font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500"
                placeholder="例: 18:00〜20:00"
              />
            </div>

            <div>
              <label className="block text-sm font-bold text-gray-700 mb-2">コート</label>
              <div className="flex flex-wrap gap-2">
                {['A', 'B', 'C', 'D', 'E'].map(court => (
                  <button
                    key={court}
                    type="button"
                    onClick={() => {
                      const newCourts = formData.courts.includes(court)
                        ? formData.courts.filter(c => c !== court)
                        : [...formData.courts, court].sort();
                      setFormData({...formData, courts: newCourts});
                    }}
                    className={`w-12 h-12 rounded-xl font-bold text-lg transition-colors ${
                      formData.courts.includes(court)
                      ? 'bg-gray-800 text-white shadow-md'
                      : 'bg-gray-50 text-gray-400 border border-gray-200 hover:bg-gray-100'
                    }`}
                  >
                    {court}
                  </button>
                ))}
              </div>
            </div>

            <div>
              <label className="block text-sm font-bold text-gray-700 mb-2">備考 (任意)</label>
              <textarea 
                className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-gray-800 h-24 resize-none focus:outline-none focus:ring-2 focus:ring-emerald-500"
                value={formData.memo} onChange={e => setFormData({...formData, memo: e.target.value})}
                placeholder="連絡事項など"
              />
            </div>
            <div className="pt-4">
               <button 
                 type="submit" 
                 disabled={formData.dates.length === 0}
                 className="w-full bg-emerald-500 disabled:bg-emerald-300 text-white font-bold text-lg py-4 rounded-xl shadow-md hover:bg-emerald-600 active:bg-emerald-700 transition-all active:scale-[0.98]"
               >
                 保存する
               </button>
            </div>
          </form>
        </div>
      );
    };

    const EventCard = ({ event, currentUser, onUpdateStatus, onUpdateComment, onShowParticipants, isAdmin, onDelete, onEdit }) => {
      const myResponse = event.responses[currentUser.id] || { status: 'unanswered', comment: '' };
      const [comment, setComment] = useState(myResponse.comment);
      const [isEditingComment, setIsEditingComment] = useState(false);
      const attendingCount = Object.values(event.responses).filter(r => r.status === 'attending').length;
      
      const handleCommentSave = () => {
        onUpdateComment(event.id, comment);
        setIsEditingComment(false);
      };
      
      const handleToggleStatus = (statusToSet) => {
        const newStatus = myResponse.status === statusToSet ? 'unanswered' : statusToSet;
        onUpdateStatus(event.id, newStatus);
      };
      
      const dateMatch = event.dateStr.match(/(\d+)月(\d+)日/);

      return (
        <div id={`event-card-${event.id}`} className="bg-white rounded-3xl shadow-sm border border-gray-100 p-5 relative overflow-hidden transition-all duration-300 scroll-mt-24">
          {isAdmin && (
            <div className="absolute top-4 right-4 flex gap-2 z-10">
              <button onClick={() => onEdit(event)} className="p-2 bg-gray-100 text-gray-500 rounded-full hover:bg-gray-200">
                <IconDots className="w-4 h-4" />
              </button>
              <button onClick={() => onDelete(event.id)} className="p-2 bg-rose-50 text-rose-500 rounded-full hover:bg-rose-100">
                <IconX className="w-4 h-4" />
              </button>
            </div>
          )}
          {event.isNext && (
            <div className="inline-block bg-rose-100 text-rose-600 text-xs font-bold px-3 py-1 rounded-full mb-3">
              次回
            </div>
          )}

          <div className="grid grid-cols-2 gap-3 mb-5">
            <div className="flex flex-col gap-2 justify-center pl-1">
              <div className="flex items-baseline gap-1 whitespace-nowrap overflow-hidden">
                <span className="text-[34px] font-bold text-gray-800 leading-none tracking-tight">
                  {dateMatch ? (
                    <>
                      {dateMatch[1]}<span className="text-[20px]">月</span>{dateMatch[2]}<span className="text-[20px]">日</span>
                    </>
                  ) : event.dateStr}
                </span>
                <span className="text-[22px] font-bold text-gray-500 leading-none pb-0.5">
                  ({event.dayStr})
                </span>
              </div>
              
              <div className="flex items-start gap-3 mt-1">
                {event.courts && event.courts.length > 0 && (
                  <span className="text-[28px] font-bold text-gray-800 leading-none tracking-tight whitespace-nowrap mt-1">
                    {event.courts.length}<span className="text-lg">面</span>
                  </span>
                )}
                <div className="flex flex-col text-gray-500 font-bold text-[15px] leading-tight gap-1 whitespace-nowrap">
                  <span>{event.timeStr}</span>
                  {event.courts && event.courts.length > 0 && (
                    <span>{event.courts.join('・')}コート</span>
                  )}
                </div>
              </div>
            </div>

            <div 
              onClick={() => onShowParticipants(event)}
              className="bg-gray-50 border border-gray-100 rounded-2xl flex flex-col items-center justify-center px-5 py-3 cursor-pointer active:scale-95 transition-transform"
            >
              <span className="text-xs font-bold text-gray-500 mb-1">参加予定</span>
              <div className="flex items-baseline gap-1 text-gray-800">
                <span className="text-[32px] font-black leading-none">{attendingCount}</span>
                <span className="text-sm font-bold">人</span>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3 mb-4">
            <button 
              onClick={() => handleToggleStatus('attending')}
              className={`py-3.5 rounded-2xl font-bold text-lg transition-all flex flex-col items-center justify-center gap-1 active:scale-[0.98] ${
                myResponse.status === 'attending' 
                ? 'bg-emerald-500 text-white shadow-md shadow-emerald-200' 
                : 'bg-white text-gray-400 border border-gray-200 hover:bg-gray-50'
              }`}
            >
              <IconCheck className="w-5 h-5 mb-0.5" />
              <span>参加</span>
            </button>
            <button 
              onClick={() => handleToggleStatus('absent')}
              className={`py-3.5 rounded-2xl font-bold text-lg transition-all flex flex-col items-center justify-center gap-1 active:scale-[0.98] ${
                myResponse.status === 'absent' 
                ? 'bg-rose-50 text-rose-600 shadow-inner border border-rose-100' 
                : 'bg-white text-gray-400 border border-gray-200 hover:bg-gray-50'
              }`}
            >
              <IconX className="w-5 h-5 mb-0.5" />
              <span>不参加</span>
            </button>
          </div>

          <div className="flex gap-2">
            {isEditingComment ? (
              <div className="flex-1 flex gap-2">
                <input 
                  type="text" 
                  value={comment}
                  onChange={e => setComment(e.target.value)}
                  placeholder="遅れて参加など"
                  className="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500"
                  autoFocus
                />
                <button onClick={handleCommentSave} className="bg-gray-800 text-white px-5 rounded-xl text-sm font-bold whitespace-nowrap">
                  保存
                </button>
              </div>
            ) : (
              <div 
                onClick={() => setIsEditingComment(true)}
                className="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-400 cursor-text"
              >
                {comment || '遅れて参加など'}
              </div>
            )}
          </div>
        </div>
      );
    };

    const CalendarTab = ({ events, currentUser, onNavigate, onUpdateStatus }) => {
      const [viewMode, setViewMode] = useState('list'); 
      const timerRef = useRef(null);
      const isLongPressRef = useRef(false);

      const handlePointerDown = (e, eventId) => {
        isLongPressRef.current = false;
        timerRef.current = setTimeout(() => {
          isLongPressRef.current = true;
          onNavigate(eventId);
        }, 500);
      };

      const handlePointerUp = (e, ev, myStatus) => {
        if (timerRef.current) clearTimeout(timerRef.current);
        if (!isLongPressRef.current && onUpdateStatus) {
          let nextStatus = 'attending';
          if (myStatus === 'attending') nextStatus = 'absent';
          else if (myStatus === 'absent') nextStatus = 'unanswered';
          onUpdateStatus(ev.id, nextStatus);
        }
      };

      const handlePointerCancel = (e) => {
        if (timerRef.current) clearTimeout(timerRef.current);
      };

      const handleIconClick = (e) => {
        e.stopPropagation();
      };

      const today = new Date();
      const dayOfWeek = today.getDay(); 
      
      const startDate = new Date(today.getFullYear(), today.getMonth(), today.getDate() - dayOfWeek);

      const calendarDays = Array.from({ length: 112 }, (_, i) => {
        const d = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate() + i);
        return {
          date: d,
          ymd: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`,
          day: d.getDate(),
          month: d.getMonth() + 1,
          year: d.getFullYear(),
          isToday: d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today.getDate()
        };
      });

      const weeks = [];
      for (let i = 0; i < calendarDays.length; i += 7) {
        weeks.push(calendarDays.slice(i, i + 7));
      }

      const startMonth = calendarDays[0].month;
      const startYear = calendarDays[0].year;
      
      const startYMD = calendarDays[0].ymd;
      const endYMD = calendarDays[calendarDays.length - 1].ymd;
      const periodEvents = events.filter(ev => ev.date >= startYMD && ev.date <= endYMD).sort((a, b) => a.date.localeCompare(b.date));

      const [visiblePeriod, setVisiblePeriod] = useState(`${startYear}年 ${startMonth}月`);

      useEffect(() => {
        const container = document.getElementById('main-scroll-container');
        if (!container) return;

        const handleScroll = () => {
          const targetSelector = viewMode === 'grid' ? '.snap-row' : '.event-list-item';
          const elements = document.querySelectorAll(targetSelector);
          
          const containerTop = container.getBoundingClientRect().top;
          const stickyOffset = viewMode === 'grid' ? 80 : 50; 
          
          let topElement = null;
          for (let el of elements) {
            const rect = el.getBoundingClientRect();
            if (rect.bottom > containerTop + stickyOffset) {
              topElement = el;
              break;
            }
          }
          
          if (!topElement && elements.length > 0) {
            topElement = elements[elements.length - 1];
          }

          if (topElement) {
            let year, month;
            if (viewMode === 'grid') {
              const firstDayCell = topElement.querySelector('.calendar-day-cell');
              if (firstDayCell) {
                year = firstDayCell.getAttribute('data-year');
                month = firstDayCell.getAttribute('data-month');
              }
            } else {
              year = topElement.getAttribute('data-year');
              month = topElement.getAttribute('data-month');
            }
            if (year && month) {
              setVisiblePeriod(`${year}年 ${month}月`);
            }
          }
        };

        container.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll(); 
        return () => container.removeEventListener('scroll', handleScroll);
      }, [viewMode, periodEvents]);

      return (
        <div className="px-4 flex flex-col">
          {viewMode === 'grid' && (
            <style dangerouslySetInnerHTML={{__html: `
              #main-scroll-container {
                scroll-snap-type: y mandatory;
              }
              .snap-row {
                scroll-snap-align: start;
                scroll-margin-top: 80px; 
              }
            `}} />
          )}
          
          <div className="flex flex-col shrink-0 sticky -top-6 bg-gray-50 z-20 pt-6 pb-2 -mx-4 px-4 border-b border-gray-100 h-[56px] box-border">
            <div className="flex items-center justify-between">
              <h2 className="text-xl font-black text-gray-800 tracking-tight">{visiblePeriod}</h2>
              <div className="flex bg-gray-100/80 rounded-lg p-1 border border-gray-200/50">
                <button onClick={() => setViewMode('grid')} className={`px-3 py-1.5 text-xs font-bold rounded-md transition-colors ${viewMode === 'grid' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-400'}`}>カレンダー</button>
                <button onClick={() => setViewMode('list')} className={`px-3 py-1.5 text-xs font-bold rounded-md transition-colors ${viewMode === 'list' ? 'bg-white text-gray-800 shadow-sm' : 'text-gray-400'}`}>一覧</button>
              </div>
            </div>
          </div>

          {viewMode === 'grid' && (
            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col relative mt-2">
              
              <div className="grid grid-cols-7 gap-px bg-gray-100 border-b border-gray-100 shrink-0 sticky top-[32px] z-10 rounded-t-2xl overflow-hidden shadow-sm h-[32px] box-border">
                {['日', '月', '火', '水', '木', '金', '土'].map((day, i) => (
                  <div key={day} className={`text-center py-2 text-[10px] font-bold bg-white flex items-center justify-center ${i === 0 ? 'text-rose-400' : i === 6 ? 'text-blue-400' : 'text-gray-400'}`}>
                    {day}
                  </div>
                ))}
              </div>

              <div className="flex-1 bg-gray-100 flex flex-col gap-px p-px pb-8 rounded-b-2xl">
                {weeks.map((week, wIdx) => (
                  <div key={wIdx} className="grid grid-cols-7 gap-px snap-row w-full bg-gray-100">
                    {week.map((dayObj) => {
                      const dayEvents = periodEvents.filter(e => e.date === dayObj.ymd);
                      const displayDate = dayObj.day === 1 ? `${dayObj.month}/${dayObj.day}` : dayObj.day;
                      
                      const isHoliday = HOLIDAYS.includes(dayObj.ymd);
                      const isSunday = dayObj.date.getDay() === 0;
                      const isSaturday = dayObj.date.getDay() === 6;
                      
                      let dateTextColor = 'text-gray-700';
                      if (isHoliday || isSunday) dateTextColor = 'text-rose-500';
                      else if (isSaturday) dateTextColor = 'text-blue-500';

                      return (
                        <div 
                          key={dayObj.ymd} 
                          className={`calendar-day-cell bg-white p-1 flex flex-col items-center min-h-[80px] ${dayObj.isToday ? 'bg-blue-50/30' : ''}`}
                          data-year={dayObj.year}
                          data-month={dayObj.month}
                        >
                          <span className={`text-[11px] font-bold mt-1 ${dayObj.isToday ? 'bg-blue-500 text-white w-5 h-5 flex items-center justify-center rounded-full' : dateTextColor}`}>
                            {displayDate}
                          </span>
                          
                          {dayEvents.length > 0 && (
                            <div className="mt-1 w-full flex flex-col gap-1">
                              {dayEvents.map((ev, idx) => {
                                const attendingCount = Object.values(ev.responses).filter(r => r.status === 'attending').length;
                                const myStatus = ev.responses[currentUser.id]?.status;
                                
                                const isAttending = myStatus === 'attending';
                                const isAbsent = myStatus === 'absent';
                                
                                const cardStyle = isAttending 
                                  ? 'bg-emerald-50 border-emerald-100 text-gray-800' 
                                  : isAbsent 
                                  ? 'bg-rose-50 border-rose-100 text-gray-800' 
                                  : 'bg-white border-gray-200 text-gray-700 border-dashed';

                                return (
                                  <div 
                                    key={idx} 
                                    onPointerDown={(e) => handlePointerDown(e, ev.id)}
                                    onPointerUp={(e) => handlePointerUp(e, ev, myStatus)}
                                    onPointerLeave={handlePointerCancel}
                                    onPointerCancel={handlePointerCancel}
                                    onClick={handleIconClick}
                                    style={{ WebkitTouchCallout: 'none' }}
                                    className={`border rounded py-1.5 px-0.5 cursor-pointer flex flex-col items-center justify-center shadow-sm active:scale-95 transition-transform w-full gap-1 select-none ${cardStyle}`}
                                  >
                                    <div className="flex items-center justify-center pointer-events-none">
                                      {isAttending && <IconCheck className="w-4 h-4 text-emerald-600" />}
                                      {isAbsent && <IconX className="w-4 h-4 text-rose-500" />}
                                      {(!myStatus || myStatus === 'unanswered') && <IconMinus className="w-4 h-4 text-gray-400" />}
                                    </div>
                                    <div className="flex flex-col items-center gap-0.5 mt-0.5 text-gray-800">
                                      <div className="text-[10px] font-bold leading-none pointer-events-none">{attendingCount}人</div>
                                      <div className="text-[10px] font-bold leading-none whitespace-nowrap pointer-events-none">
                                        {ev.courts?.length || 0}面
                                      </div>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>
            </div>
          )}

          {viewMode === 'list' && (
            <div className="flex flex-col gap-3 pb-8 mt-4">
              {periodEvents.length === 0 ? (
                <div className="text-center py-12 text-gray-400 text-sm font-bold bg-white rounded-2xl border border-gray-100 border-dashed">
                  予定はありません
                </div>
              ) : (
                periodEvents.map(ev => {
                  const attendingCount = Object.values(ev.responses).filter(r => r.status === 'attending').length;
                  const dateMatch = ev.dateStr.match(/(\d+)月(\d+)日/);
                  const myStatus = ev.responses[currentUser.id]?.status;
                  
                  return (
                    <div 
                      key={ev.id} 
                      className="event-list-item bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex items-center justify-between active:bg-gray-50 transition-colors relative"
                      data-year={ev.date.split('-')[0]}
                      data-month={parseInt(ev.date.split('-')[1], 10)}
                    >
                      <div className="flex flex-col gap-2 justify-center pl-1">
                        <div className="flex items-baseline gap-1 whitespace-nowrap overflow-hidden">
                          <span className="text-[28px] font-bold text-gray-800 leading-none tracking-tight">
                            {dateMatch ? (
                              <>
                                {dateMatch[1]}<span className="text-[18px]">月</span>{dateMatch[2]}<span className="text-[18px]">日</span>
                              </>
                            ) : ev.dateStr}
                          </span>
                          <span className="text-[18px] font-bold text-gray-500 leading-none pb-0.5">
                            ({ev.dayStr})
                          </span>
                        </div>
                        
                        <div className="flex items-start gap-3 mt-1">
                          {ev.courts && ev.courts.length > 0 && (
                            <span className="text-[24px] font-bold text-gray-800 leading-none tracking-tight whitespace-nowrap mt-1">
                              {ev.courts.length}<span className="text-sm">面</span>
                            </span>
                          )}
                          <div className="flex flex-col text-gray-500 font-bold text-[14px] leading-tight gap-1 whitespace-nowrap">
                            <span>{ev.timeStr}</span>
                            {ev.courts && ev.courts.length > 0 && (
                              <span>{ev.courts?.join('・')}コート</span>
                            )}
                          </div>
                        </div>
                      </div>
                      
                      <div className="flex items-stretch gap-2 h-full">
                        <div className="bg-gray-50 border border-gray-100 rounded-2xl flex flex-col items-center justify-center px-3 py-3 min-w-[72px]">
                          <span className="text-[10px] font-bold text-gray-500 mb-1">参加予定</span>
                          <div className="flex items-baseline gap-1 text-gray-800">
                            <span className="text-[24px] font-black leading-none">{attendingCount}</span>
                            <span className="text-sm font-bold">人</span>
                          </div>
                        </div>
                        
                        <div 
                          onPointerDown={(e) => handlePointerDown(e, ev.id)}
                          onPointerUp={(e) => handlePointerUp(e, ev, myStatus)}
                          onPointerLeave={handlePointerCancel}
                          onPointerCancel={handlePointerCancel}
                          onClick={handleIconClick}
                          onContextMenu={(e) => { e.preventDefault(); e.stopPropagation(); }}
                          style={{ WebkitTouchCallout: 'none' }}
                          className={`flex-shrink-0 flex flex-col items-center justify-center border rounded-2xl min-w-[72px] cursor-pointer select-none active:scale-95 transition-transform ${
                            myStatus === 'attending' ? 'bg-emerald-50 border-emerald-100 text-emerald-600' :
                            myStatus === 'absent' ? 'bg-rose-50 border-rose-100 text-rose-500' :
                            'bg-white border-gray-200 border-dashed text-gray-300'
                          }`}
                        >
                          {myStatus === 'attending' && <IconCheck className="w-8 h-8" />}
                          {myStatus === 'absent' && <IconX className="w-8 h-8" />}
                          {(!myStatus || myStatus === 'unanswered') && <IconMinus className="w-8 h-8" />}
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}
        </div>
      );
    };

    function App() {
      const [currentUser] = useState(MOCK_USERS[0]); 
      const [users] = useState(MOCK_USERS);
      const [events, setEvents] = useState(INITIAL_EVENTS);
      const [currentTab, setCurrentTab] = useState('calendar');
      const [isAdmin, setIsAdmin] = useState(false); 
      
      const [toast, setToast] = useState({ message: '', visible: false });
      const [selectedEvent, setSelectedEvent] = useState(null);
      
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [editingEvent, setEditingEvent] = useState(null);

      const handleNavigateToEvent = (eventId) => {
        setCurrentTab('schedule');
        setTimeout(() => {
          const el = document.getElementById(`event-card-${eventId}`);
          const scrollContainer = document.getElementById('main-scroll-container');
          if (el && scrollContainer) {
            const containerTop = scrollContainer.getBoundingClientRect().top;
            const elTop = el.getBoundingClientRect().top;
            const targetScrollTop = scrollContainer.scrollTop + elTop - containerTop - 20;

            scrollContainer.scrollTo({ top: targetScrollTop, behavior: 'smooth' });
            
            const originalTransition = el.style.transition;
            el.style.transition = 'box-shadow 0.3s ease, transform 0.3s ease';
            el.style.boxShadow = '0 0 0 4px rgba(16, 185, 129, 0.4)'; 
            el.style.transform = 'scale(1.02)';
            
            setTimeout(() => {
              el.style.boxShadow = '';
              el.style.transform = '';
              setTimeout(() => {
                el.style.transition = originalTransition;
              }, 300);
            }, 1200);
          }
        }, 50);
      };

      const showToast = (msg) => {
        setToast({ message: msg, visible: true });
        setTimeout(() => {
          setToast({ message: '', visible: false });
        }, 2500);
      };

      const handleUpdateStatus = (eventId, newStatus) => {
        setEvents(prev => prev.map(ev => {
          if (ev.id !== eventId) return ev;
          const newResponses = { ...ev.responses };
          newResponses[currentUser.id] = {
            ...newResponses[currentUser.id],
            status: newStatus
          };
          return { ...ev, responses: newResponses };
        }));
      };

      const handleUpdateComment = (eventId, newComment) => {
        setEvents(prev => prev.map(ev => {
          if (ev.id !== eventId) return ev;
          const newResponses = { ...ev.responses };
          newResponses[currentUser.id] = {
            status: newResponses[currentUser.id]?.status || 'unanswered',
            comment: newComment
          };
          return { ...ev, responses: newResponses };
        }));
      };

      const handleDeleteEvent = (eventId) => {
        if (window.confirm('この予定を削除してもよろしいですか？')) {
          setEvents(prev => prev.filter(ev => ev.id !== eventId));
          showToast('予定を削除しました');
        }
      };

      const handleSaveEvent = (formData) => {
        const days = ['日', '月', '火', '水', '木', '金', '土'];

        if (editingEvent) {
          const d = new Date(formData.dates[0]);
          setEvents(prev => prev.map(ev => ev.id === editingEvent.id ? { 
            ...ev, 
            date: formData.dates[0],
            dateStr: `${d.getMonth() + 1}月${d.getDate()}日`,
            dayStr: days[d.getDay()],
            timeStr: formData.timeStr,
            courts: formData.courts,
            memo: formData.memo
          } : ev));
          showToast('予定を更新しました');
        } else {
          const newEvents = formData.dates.map((dateString, index) => {
            const d = new Date(dateString);
            return {
              id: `e${Date.now()}_${index}`,
              date: dateString,
              dateStr: `${d.getMonth() + 1}月${d.getDate()}日`,
              dayStr: days[d.getDay()],
              timeStr: formData.timeStr,
              courts: formData.courts,
              memo: formData.memo,
              isNext: false,
              responses: {}
            };
          });
          setEvents(prev => [...prev, ...newEvents].sort((a, b) => a.date.localeCompare(b.date)));
          showToast(`${newEvents.length}件の予定を追加しました`);
        }
        setIsFormOpen(false);
        setEditingEvent(null);
      };

      const openEditForm = (ev) => {
        setEditingEvent(ev);
        setIsFormOpen(true);
      };

      return (
        <div className="min-h-screen bg-gray-200 md:py-8 font-sans antialiased text-gray-900 selection:bg-emerald-200 flex justify-center">
          
          <div className="w-full max-w-[430px] bg-gray-50 h-[100dvh] md:h-[850px] shadow-2xl relative overflow-hidden flex flex-col md:rounded-[2.5rem] md:border-8 border-gray-800">
            
            <header className="bg-white px-6 pt-12 pb-4 shadow-sm z-10 shrink-0 sticky top-0">
              <div className="flex justify-between items-center">
                <h1 className="text-xl font-black text-emerald-400 tracking-tight">Tennis Schedule</h1>
                <span className="text-[28px] font-bold text-gray-800 leading-none tracking-tight">
                  {currentUser.name}
                </span>
              </div>
            </header>

            <main id="main-scroll-container" className="flex-1 overflow-y-auto pb-24 px-4 pt-6 relative">
              
              {currentTab === 'schedule' && (
                <div>
                  {events.length === 0 ? (
                    <div className="text-center py-20 text-gray-400">
                      <p>今後の予定はありません。</p>
                    </div>
                  ) : (
                    <>
                      <div className="space-y-6">
                        {events.map(ev => (
                          <EventCard 
                            key={ev.id} 
                            event={ev} 
                            currentUser={currentUser}
                            onUpdateStatus={handleUpdateStatus}
                            onUpdateComment={handleUpdateComment}
                            onShowParticipants={setSelectedEvent}
                            isAdmin={isAdmin}
                            onDelete={handleDeleteEvent}
                            onEdit={openEditForm}
                          />
                        ))}
                      </div>
                      <div className="mt-8 text-center pb-8">
                         <button className="text-sm font-bold text-gray-400 hover:text-gray-600 px-6 py-3 bg-gray-200/50 rounded-full">
                           過去の予定を見る
                         </button>
                      </div>
                    </>
                  )}
                </div>
              )}

              {currentTab === 'calendar' && (
                <CalendarTab events={events} currentUser={currentUser} onNavigate={handleNavigateToEvent} onUpdateStatus={handleUpdateStatus} />
              )}

              {currentTab === 'settings' && (
                <div className="px-2">
                  <h2 className="text-2xl font-bold mb-6 text-gray-800">プロフィール</h2>
                  
                  <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-6">
                    <div className="p-4 border-b border-gray-50 flex items-center justify-between">
                      <span className="font-medium text-gray-700">通知設定</span>
                      <div className="w-11 h-6 bg-emerald-500 rounded-full relative">
                        <div className="w-5 h-5 bg-white rounded-full absolute top-0.5 right-0.5 shadow-sm"></div>
                      </div>
                    </div>
                    <div className="p-4 flex items-center justify-between">
                      <span className="font-medium text-gray-700">プロフィール編集</span>
                      <IconChevronRight className="text-gray-400" />
                    </div>
                  </div>

                  <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-100 mb-6">
                    <p className="text-xs text-emerald-800 font-bold mb-2">デモ用機能</p>
                    <label className="flex items-center gap-3">
                      <input type="checkbox" checked={isAdmin} onChange={e => setIsAdmin(e.target.checked)} className="w-5 h-5 text-emerald-600 rounded" />
                      <span className="text-sm font-medium text-emerald-900">管理者モードを有効にする</span>
                    </label>
                    {isAdmin && <p className="text-xs text-emerald-700 mt-2 mt-1">※予定画面の右下に追加ボタンが表示されます</p>}
                  </div>

                  {isAdmin && (
                    <div>
                      <h3 className="text-sm font-bold text-gray-500 mb-3 ml-2">管理者メニュー</h3>
                      <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <button className="w-full text-left p-4 border-b border-gray-50 flex items-center justify-between hover:bg-gray-50">
                          <span className="font-medium text-gray-700">ユーザー管理</span>
                          <IconChevronRight className="text-gray-400" />
                        </button>
                        <button className="w-full text-left p-4 flex items-center justify-between hover:bg-gray-50">
                          <span className="font-medium text-gray-700">PIN再設定</span>
                          <IconChevronRight className="text-gray-400" />
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </main>

            {isAdmin && currentTab === 'schedule' && (
              <button 
                onClick={() => { setEditingEvent(null); setIsFormOpen(true); }}
                className="absolute bottom-20 right-6 w-14 h-14 bg-emerald-500 text-white rounded-full shadow-lg shadow-emerald-500/30 flex items-center justify-center hover:bg-emerald-600 transition-transform active:scale-95 z-20"
              >
                <IconPlus />
              </button>
            )}

            <nav className="absolute bottom-0 w-full bg-white border-t border-gray-100 z-30 shrink-0 shadow-[0_-4px_20px_rgba(0,0,0,0.03)] pb-safe">
              <div className="flex justify-around items-center h-[72px] px-2">
                <button 
                  onClick={() => setCurrentTab('calendar')}
                  className={`flex flex-col items-center justify-center w-full h-full gap-1.5 ${currentTab === 'calendar' ? 'text-emerald-600' : 'text-gray-400 hover:text-gray-600'}`}
                >
                  <IconCalendar className={currentTab === 'calendar' ? 'text-emerald-500' : ''} />
                  <span className="text-[10px] font-bold">出欠</span>
                </button>
                <button 
                  onClick={() => setCurrentTab('settings')}
                  className={`flex flex-col items-center justify-center w-full h-full gap-1.5 ${currentTab === 'settings' ? 'text-emerald-600' : 'text-gray-400 hover:text-gray-600'}`}
                >
                  <IconUser className={currentTab === 'settings' ? 'text-emerald-500' : ''} />
                  <span className="text-[10px] font-bold">プロフィール</span>
                </button>
                <button 
                  onClick={() => setCurrentTab('schedule')}
                  className={`flex flex-col items-center justify-center w-full h-full gap-1.5 ${currentTab === 'schedule' ? 'text-emerald-600' : 'text-gray-400 hover:text-gray-600'}`}
                >
                  <IconList className={currentTab === 'schedule' ? 'text-emerald-500' : ''} />
                  <span className="text-[10px] font-bold">予定登録</span>
                </button>
              </div>
            </nav>

            <ParticipantsBottomSheet 
              isOpen={!!selectedEvent} 
              onClose={() => setSelectedEvent(null)} 
              event={selectedEvent} 
              users={users} 
            />
            
            <EventFormModal 
              isOpen={isFormOpen} 
              onClose={() => setIsFormOpen(false)} 
              onSave={handleSaveEvent} 
              eventToEdit={editingEvent}
            />

            <Toast message={toast.message} visible={toast.visible} />
            
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
