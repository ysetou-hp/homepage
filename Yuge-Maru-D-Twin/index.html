<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>船舶姿勢3Dビジュアライザ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js 本体 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- GLTFLoader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        /* =========================================
           SF・サイバーパンク風 カスタムCSS
           ========================================= */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #050811; /* ディープネイビー */
            /* 背景のうっすらとしたグリッド線 */
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* サイバーパネルの共通ベース */
        .cyber-panel {
            background: rgba(5, 10, 20, 0.7);
            border: 1px solid rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.05) inset;
            backdrop-filter: blur(4px);
            position: relative;
        }

        /* 四隅の装飾フレーム */
        .cyber-panel::before, .cyber-panel::after {
            content: '';
            position: absolute;
            width: 12px; height: 12px;
            border: 2px solid #0ff;
            pointer-events: none;
        }
        .cyber-panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .cyber-panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        /* ヘッダー文字 */
        .cyber-header {
            color: #0ff;
            letter-spacing: 0.1em;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            text-transform: uppercase;
        }

        /* スライダーのカスタムスタイル (HUD風) */
        input[type=range] {
            -webkit-appearance: none !important;
            -moz-appearance: none !important;
            appearance: none !important;
            width: 100%;
            height: 20px !important; /* Firefoxでトラックとツマミを正しく表示・配置するための高さ確保 */
            background: transparent !important;
            margin: 8px 0;
            cursor: pointer;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-moz-focus-outer {
            border: 0;
        }
        
        /* WebKit (Chrome, Safari, Edge) */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 2px !important;
            background: rgba(0, 255, 255, 0.5) !important;
            border: none !important;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none !important;
            appearance: none !important;
            height: 16px !important;
            width: 6px !important;
            background: #0ff !important;
            box-shadow: 0 0 10px #0ff !important;
            margin-top: -7px !important;
            border-radius: 0 !important;
            border: none !important;
        }

        /* Firefox */
        input[type=range]::-moz-range-track {
            width: 100%;
            height: 2px !important;
            background: rgba(0, 255, 255, 0.5) !important;
            border: none !important;
        }
        input[type=range]::-moz-range-thumb {
            -moz-appearance: none !important;
            appearance: none !important;
            height: 16px !important;
            width: 6px !important;
            background: #0ff !important;
            box-shadow: 0 0 10px #0ff !important;
            border-radius: 0 !important;
            border: none !important;
        }
        input[type=range]::-moz-range-progress {
            background: rgba(0, 255, 255, 0.5) !important;
            height: 2px !important;
        }

        /* ボタン */
        .cyber-btn {
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.5);
            color: #0ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .cyber-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            text-shadow: 0 0 5px #0ff;
        }
        .cyber-btn.btn-alert {
            border-color: #f0f; color: #f0f; background: rgba(255, 0, 255, 0.05);
        }
        .cyber-btn.btn-alert:hover {
            background: rgba(255, 0, 255, 0.2); box-shadow: 0 0 10px rgba(255, 0, 255, 0.4); text-shadow: 0 0 5px #f0f;
        }

        /* ログの上部を透過させるマスク */
        .mask-fade-top {
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%);
        }

        /* ログ用フェードインアニメーション */
        .log-line {
            /* ★ ログが高速で流れるため、アニメーション時間を短縮 */
            animation: fadeIn 0.15s ease-out;
            text-shadow: 0 0 4px rgba(0, 255, 255, 0.4);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>

    <!-- ★ 人が編集しやすいようにスクリプトと設定を上部に移動しました -->
    <script>
        // ==========================================
        // ★ システム設定（編集エリア）
        // ==========================================
        // ここにある数値を変更するだけで、システムの初期設定を変えられます
        const SETTINGS = {
            // [モデル設定]
            MODEL_OFFSET_Y: 1.2,          // モデルのY軸初期オフセット(高さの調整)
            MODEL_OFFSET_Z: 0.2,          // モデルのZ軸初期オフセット(前後の調整)
            DEFAULT_MODEL_URL: 'yuge_shousen_v10.glb',        // 起動時に自動で読み込むGLBファイル (例: 'yugemaru.glb')
            
            // [カメラ初期設定]
            CAMERA_INIT_POS: { x: -4, y: 3.5, z: -11 }, // カメラの初期方向
            CAMERA_INIT_ZOOM: 12.5,       // カメラの初期距離 (ZOOM)
            
            // [UI・システム設定]
            MAX_LOGS: 25,                 // ログの最大表示行数
            GRAPH_UPDATE_MS: 100          // リアルタイムグラフ・ログの更新間隔(ミリ秒)
        };

        // ==========================================
        // ★ メインシステムロジック
        // ==========================================
        // HTML要素(DOM)の読み込みが完了してから実行されます
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- ログシステム (エラー回避のため最初に定義) ---
            const logContent = document.getElementById('log-content');

            function addLog(msg, type = "INFO") {
                const now = new Date();
                const timeStr = String(now.getHours()).padStart(2, '0') + ':' + 
                                String(now.getMinutes()).padStart(2, '0') + ':' + 
                                String(now.getSeconds()).padStart(2, '0') + '.' + 
                                String(now.getMilliseconds()).padStart(3, '0');
                let color = 'text-cyan-400';
                if(type === 'WARN') color = 'text-fuchsia-400';
                else if(type === 'ERR') color = 'text-red-500';

                const p = document.createElement('div');
                p.className = `log-line ${color}`;
                p.innerHTML = `<span class="opacity-50">[${timeStr}]</span> <span class="font-bold">${type}</span> : ${msg}`;
                
                logContent.appendChild(p);
                // SETTINGS の最大ログ数を使用
                if (logContent.children.length > SETTINGS.MAX_LOGS) {
                    logContent.removeChild(logContent.firstChild);
                }
            }

            addLog("SYSTEM BOOT SEQUENCE INITIATED", "INFO");

            // --- Three.js の基本セットアップ ---
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            // 背面のDOM要素（HUDやログ）を透かして見せるため、sceneの背景色塗りつぶしを削除(null)
            scene.background = null; 
            scene.fog = new THREE.Fog(0x050811, 20, 150);

            // 宇宙/サイバー空間の底面に薄いシアンのグリッドを敷く
            const bgGrid = new THREE.GridHelper(200, 100, 0x00ffff, 0x00ffff);
            bgGrid.position.y = 0; // XZ平面に一致させる
            bgGrid.material.opacity = 0.2; // 濃くする
            bgGrid.material.transparent = true;
            scene.add(bgGrid);

            // カメラ設定 (SETTINGSの値を適用)
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(SETTINGS.CAMERA_INIT_POS.x, SETTINGS.CAMERA_INIT_POS.y, SETTINGS.CAMERA_INIT_POS.z).setLength(SETTINGS.CAMERA_INIT_ZOOM);

            // レンダラー設定
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setClearColor(0x000000, 0); // 透過色設定
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.7;
            container.appendChild(renderer.domElement);

            // カメラコントローラー
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            // ★ 初期状態でカメラを自動回転させる
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.2; 
            controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.ROTATE, RIGHT: THREE.MOUSE.PAN };

            // --- ライティング ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(20, 30, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);
            const bottomLight = new THREE.DirectionalLight(0xffffff, 0.6);
            bottomLight.position.set(0, -30, 0);
            scene.add(bottomLight);

            // --- 中心からの垂直線 ---
            const verticalLineMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6 });
            const verticalLineGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, 0),
                new THREE.Vector3(0, 5.2, 0) 
            ]);
            const verticalLine = new THREE.Line(verticalLineGeo, verticalLineMat);
            scene.add(verticalLine);

            // --- HUD コンパスの描画 ---
            function initHudCompass() {
                const bgCanvas = document.getElementById('hud-compass-bg');
                const bgCtx = bgCanvas.getContext('2d');
                const w = bgCanvas.width, h = bgCanvas.height;
                const center = w / 2, radius = 480; 

                bgCtx.clearRect(0, 0, w, h);
                bgCtx.shadowColor = '#00ffff';
                bgCtx.shadowBlur = 8;

                bgCtx.beginPath(); bgCtx.arc(center, center, radius + 45, 0, 2 * Math.PI);
                bgCtx.lineWidth = 1; bgCtx.strokeStyle = 'rgba(0, 255, 255, 0.15)'; bgCtx.stroke();

                bgCtx.beginPath(); bgCtx.arc(center, center, radius, 0, 2 * Math.PI);
                bgCtx.lineWidth = 2; bgCtx.strokeStyle = 'rgba(0, 255, 255, 0.4)'; bgCtx.stroke();

                bgCtx.setLineDash([3, 8]);
                bgCtx.beginPath(); bgCtx.arc(center, center, radius - 35, 0, 2 * Math.PI);
                bgCtx.lineWidth = 6; bgCtx.strokeStyle = 'rgba(0, 255, 255, 0.2)'; bgCtx.stroke();
                bgCtx.setLineDash([]); 

                bgCtx.beginPath(); bgCtx.arc(center, center, radius - 55, 0, 2 * Math.PI);
                bgCtx.lineWidth = 1; bgCtx.strokeStyle = 'rgba(0, 255, 255, 0.25)'; bgCtx.stroke();

                bgCtx.setLineDash([15, 20]);
                bgCtx.beginPath(); bgCtx.arc(center, center, radius - 70, 0, 2 * Math.PI);
                bgCtx.lineWidth = 1; bgCtx.strokeStyle = 'rgba(0, 255, 255, 0.4)'; bgCtx.stroke();
                bgCtx.setLineDash([]);

                bgCtx.translate(center, center);
                bgCtx.textAlign = 'center'; bgCtx.textBaseline = 'middle';

                for (let i = 0; i < 360; i += 2.5) { 
                    bgCtx.save();
                    bgCtx.rotate((i - 90) * Math.PI / 180);
                    bgCtx.beginPath();
                    if (i % 90 === 0) {
                        bgCtx.moveTo(radius - 5, 0); bgCtx.lineTo(radius + 15, 0);
                        bgCtx.lineWidth = 3; bgCtx.strokeStyle = '#00ffff'; bgCtx.stroke();
                        let text = i === 0 ? 'N' : i === 90 ? 'E' : i === 180 ? 'S' : 'W';
                        bgCtx.translate(radius + 32, 0); bgCtx.rotate(-(i - 90) * Math.PI / 180); 
                        bgCtx.font = 'bold 20px "Share Tech Mono", monospace';
                        bgCtx.fillStyle = '#ffffff'; bgCtx.shadowBlur = 10;
                        bgCtx.fillText(text, 0, 0);
                    } else if (i % 30 === 0) {
                        bgCtx.moveTo(radius, 0); bgCtx.lineTo(radius + 10, 0);
                        bgCtx.lineWidth = 2; bgCtx.strokeStyle = '#00ffff'; bgCtx.stroke();
                        bgCtx.translate(radius + 24, 0); bgCtx.rotate(-(i - 90) * Math.PI / 180);
                        bgCtx.font = '10px "Share Tech Mono", monospace';
                        bgCtx.fillStyle = 'rgba(0, 255, 255, 0.9)'; bgCtx.shadowBlur = 4;
                        bgCtx.fillText(i.toString().padStart(3, '0'), 0, 0);
                    } else if (i % 10 === 0) {
                        bgCtx.moveTo(radius, 0); bgCtx.lineTo(radius + 6, 0);
                        bgCtx.lineWidth = 1.5; bgCtx.strokeStyle = 'rgba(0, 255, 255, 0.6)'; bgCtx.stroke();
                    } else {
                        bgCtx.moveTo(radius, 0); bgCtx.lineTo(radius + 3, 0);
                        bgCtx.lineWidth = 1; bgCtx.strokeStyle = 'rgba(0, 255, 255, 0.25)'; bgCtx.stroke();
                    }
                    bgCtx.restore();
                }

                const indCanvas = document.getElementById('hud-compass-indicator');
                const indCtx = indCanvas.getContext('2d');
                indCtx.clearRect(0, 0, w, h);
                indCtx.translate(center, center);
                indCtx.shadowColor = 'rgba(255, 165, 0, 0.8)'; 
                indCtx.shadowBlur = 15; indCtx.fillStyle = 'rgba(255, 165, 0, 0.6)';
                indCtx.beginPath();
                indCtx.moveTo(0, -(radius + 10)); 
                indCtx.lineTo(-15, -(radius + 35)); 
                indCtx.lineTo(15, -(radius + 35)); 
                indCtx.closePath(); indCtx.fill();
            }
            initHudCompass();
            addLog("HUD.COMPASS ... ONLINE", "INFO");

            // --- モデル管理 ---
            const shipGroup = new THREE.Group(); shipGroup.rotation.order = "YXZ"; scene.add(shipGroup);
            let currentModel = null;
            const loader = new THREE.GLTFLoader();

            function createDefaultShip() {
                const group = new THREE.Group();
                const hull = new THREE.Mesh(new THREE.BoxGeometry(3, 1.5, 10), new THREE.MeshStandardMaterial({ color: 0x94a3b8 }));
                hull.position.y = 0.75; hull.castShadow = true; group.add(hull);
                const bridge = new THREE.Mesh(new THREE.BoxGeometry(2, 1.5, 3), new THREE.MeshStandardMaterial({ color: 0xe2e8f0 }));
                bridge.position.set(0, 2.25, 2); bridge.castShadow = true; group.add(bridge);
                const bow = new THREE.Mesh(new THREE.BoxGeometry(3.1, 1.6, 0.5), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
                bow.position.set(0, 0.75, -5.0); group.add(bow);
                return group;
            }

            function loadModel(fileUrl, fileName) {
                loader.load(fileUrl, (gltf) => {
                    // 読み込み成功時、古いモデルがあれば削除して差し替え
                    if (currentModel) shipGroup.remove(currentModel);
                    const loadedScene = gltf.scene;
                    const box = new THREE.Box3().setFromObject(loadedScene);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    const scale = 10 / Math.max(size.x, size.y, size.z);
                    loadedScene.scale.set(scale, scale, scale);
                    loadedScene.position.sub(center.multiplyScalar(scale));
                    
                    // SETTINGS のオフセット値を適用
                    loadedScene.position.y += SETTINGS.MODEL_OFFSET_Y;
                    loadedScene.position.z += SETTINGS.MODEL_OFFSET_Z;

                    const wrapper = new THREE.Group(); wrapper.add(loadedScene);
                    wrapper.rotation.y = Math.PI;
                    currentModel = wrapper;
                    currentModel.traverse(n => { if(n.isMesh) { n.castShadow = n.receiveShadow = true; }});
                    shipGroup.add(currentModel);

                    if (fileName !== "初期モデル") {
                        const fileNameElem = document.getElementById('file-name');
                        fileNameElem.textContent = `読み込み完了: ${fileName}`;
                        fileNameElem.classList.remove('hidden');
                        addLog(`MODEL IMPORTED: ${fileName}`, "INFO");
                    } else {
                        addLog(`DEFAULT MODEL IMPORTED`, "INFO");
                    }
                }, undefined, (e) => {
                    console.warn(`モデル読み込み失敗 (${fileName}):`, e);
                    if (fileName !== "初期モデル") {
                        alert("ファイルの読み込みに失敗しました。CORS設定やファイル形式を確認してください。");
                        addLog(`IMPORT FAILED: ${fileName}`, "ERR");
                    } else {
                        // ★ 初期読み込みに失敗した時だけ、簡易モデルを生成して表示する
                        addLog(`DEFAULT MODEL NOT FOUND. FALLBACK TO BASIC.`, "WARN");
                        if (currentModel) shipGroup.remove(currentModel);
                        currentModel = createDefaultShip();
                        shipGroup.add(currentModel);
                    }
                });
            }

            // ★ 初期状態では簡易モデルを表示せず、URLの指定状況に応じて処理を分ける
            if (SETTINGS.DEFAULT_MODEL_URL && SETTINGS.DEFAULT_MODEL_URL.trim() !== '') {
                // URLが指定されている場合は読み込みを試行（失敗すればloadModel内で簡易モデルにフォールバック）
                loadModel(SETTINGS.DEFAULT_MODEL_URL, "初期モデル");
            } else {
                // URLが空の場合は読み込みに行かず、直接簡易モデルを表示
                currentModel = createDefaultShip();
                shipGroup.add(currentModel);
                addLog("BASIC MODEL INITIALIZED", "INFO");
            }

            // --- UIとループ ---
            const yawSlider = document.getElementById('yaw-slider'), pitchSlider = document.getElementById('pitch-slider'), rollSlider = document.getElementById('roll-slider');
            const yawVal = document.getElementById('yaw-val'), pitchVal = document.getElementById('pitch-val'), rollVal = document.getElementById('roll-val');

            function updateRotation() {
                const y = parseFloat(yawSlider.value), p = parseFloat(pitchSlider.value), r = parseFloat(rollSlider.value);
                yawVal.textContent = `${y.toFixed(1)}°`; pitchVal.textContent = `${p.toFixed(1)}°`; rollVal.textContent = `${r.toFixed(1)}°`;
                shipGroup.rotation.y = 0; 
                shipGroup.rotation.x = THREE.MathUtils.degToRad(p);
                shipGroup.rotation.z = -THREE.MathUtils.degToRad(r);
                const indicatorContainer = document.getElementById('hud-indicator-container');
                if (indicatorContainer) indicatorContainer.style.transform = `rotate(${y}deg)`;
            }

            [yawSlider, pitchSlider, rollSlider].forEach(s => s.addEventListener('input', updateRotation));
            document.getElementById('reset-btn').addEventListener('click', () => {
                [yawSlider, pitchSlider, rollSlider].forEach(s => s.value = 0);
                updateRotation(); 
                // SETTINGS の初期カメラ値を使用
                camera.position.set(SETTINGS.CAMERA_INIT_POS.x, SETTINGS.CAMERA_INIT_POS.y, SETTINGS.CAMERA_INIT_POS.z).setLength(SETTINGS.CAMERA_INIT_ZOOM); 
                controls.target.set(0, 0, 0);
                addLog("POSTURE & CAMERA RESET", "WARN");
            });

            document.getElementById('file-upload').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) loadModel(URL.createObjectURL(file), file.name);
            });

            // ★ 初期からデモ状態（オンライン）とする
            addLog("DATA.METRICS ... ONLINE", "INFO");
            addLog("DEMO.SEQUENCE ... STARTED", "WARN");

            document.getElementById('show-log-cb').addEventListener('change', (e) => document.getElementById('log-panel').style.display = e.target.checked ? 'flex' : 'none');
            document.getElementById('show-hud-cb').addEventListener('change', (e) => document.getElementById('hud-compass-wrapper').style.display = e.target.checked ? 'block' : 'none');
            document.getElementById('show-posture-cb').addEventListener('change', (e) => document.getElementById('posture-panel').style.display = e.target.checked ? 'block' : 'none');
            document.getElementById('show-graph-cb').addEventListener('change', (e) => document.getElementById('graph-panel').style.display = e.target.checked ? 'block' : 'none');
            document.getElementById('show-vline-cb').addEventListener('change', (e) => verticalLine.visible = e.target.checked);

            const toggleBtn = document.getElementById('toggle-panel-btn'), panelContent = document.getElementById('panel-content'), toggleIcon = document.getElementById('toggle-icon');
            let isPanelOpen = true;
            toggleBtn.addEventListener('click', () => {
                isPanelOpen = !isPanelOpen;
                panelContent.classList.toggle('hidden', !isPanelOpen);
                toggleIcon.style.transform = isPanelOpen ? 'rotate(0deg)' : 'rotate(180deg)';
            });

            // ★ isDemoMode を初期状態で true に設定し、clock をスタート
            let isDemoMode = true; 
            const clock = new THREE.Clock();
            clock.start();
            
            document.getElementById('demo-btn').addEventListener('click', (e) => {
                isDemoMode = !isDemoMode;
                e.target.textContent = isDemoMode ? 'HALT // DEMO.SEQ' : 'INITIATE // DEMO.SEQ';
                e.target.classList.toggle('btn-alert', isDemoMode);
                const badge = document.getElementById('sensor-status-badge');

                if (isDemoMode) {
                    clock.start();
                    addLog("DEMO.SEQUENCE ... STARTED", "WARN");
                    addLog("SENSOR LINK ... ONLINE", "INFO");
                    controls.autoRotate = true; 
                    badge.textContent = 'ONLINE';
                    badge.className = 'text-[9px] text-red-400 bg-red-900/30 px-1 border border-red-500/50 transition-colors';
                } else {
                    clock.stop();
                    addLog("DEMO.SEQUENCE ... HALTED", "INFO");
                    addLog("SENSOR LINK ... OFFLINE", "WARN");
                    controls.autoRotate = false; 
                    badge.textContent = 'STANDBY';
                    badge.className = 'text-[9px] text-cyan-400 bg-cyan-900/30 px-1 border border-cyan-500/50 transition-colors';
                }
            });

            const yawData = new Array(100).fill(0), pitchData = new Array(100).fill(0), rollData = new Array(100).fill(0);
            
            function hexToRgba(hex, alpha) {
                let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }

            function drawGraph(id, data, min, max, colorHex) {
                const c = document.getElementById(id); if (!c) return;
                const ctx = c.getContext('2d'), w = c.width, h = c.height;
                ctx.clearRect(0,0,w,h); 
                
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.2)'; 
                ctx.lineWidth = 1; ctx.setLineDash([2, 4]);
                ctx.beginPath(); let zy = h - ((0-min)/(max-min))*h; 
                ctx.moveTo(0,zy); ctx.lineTo(w,zy); ctx.stroke();
                ctx.setLineDash([]); 

                ctx.strokeStyle = colorHex; ctx.lineWidth = 2; ctx.beginPath();
                for(let i=0; i<100; i++) {
                    let y = h - ((Math.min(Math.max(data[i], min), max)-min)/(max-min))*h;
                    if(i===0) ctx.moveTo(0,y); else ctx.lineTo(i*(w/99),y);
                }
                ctx.stroke();

                ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
                let grad = ctx.createLinearGradient(0, 0, 0, h);
                grad.addColorStop(0, hexToRgba(colorHex, 0.4)); 
                grad.addColorStop(1, hexToRgba(colorHex, 0.0)); 
                ctx.fillStyle = grad; ctx.fill();

                let lastY = h - ((Math.min(Math.max(data[99], min), max)-min)/(max-min))*h;
                ctx.fillStyle = '#fff'; ctx.shadowColor = colorHex; ctx.shadowBlur = 8;
                ctx.beginPath(); ctx.arc(w - 2, lastY, 3, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
            }

            drawGraph('yaw-canvas', yawData, 0, 360, '#00ffff');
            drawGraph('pitch-canvas', pitchData, -15, 15, '#00ffff');
            drawGraph('roll-canvas', rollData, -15, 15, '#00ffff');

            // SETTINGS のインターバルを使用
            setInterval(() => {
                if (!isDemoMode) return;
                const y = parseFloat(yawSlider.value), p = parseFloat(pitchSlider.value), r = parseFloat(rollSlider.value);
                [yawData, pitchData, rollData].forEach((d, i) => { d.push([y,p,r][i]); d.shift(); });
                
                drawGraph('yaw-canvas', yawData, 0, 360, '#00ffff');
                drawGraph('pitch-canvas', pitchData, -15, 15, '#00ffff');
                drawGraph('roll-canvas', rollData, -15, 15, '#00ffff');
                
                document.getElementById('yaw-graph-val').textContent = `${y.toFixed(1)}°`;
                document.getElementById('pitch-graph-val').textContent = `${p.toFixed(1)}°`;
                document.getElementById('roll-graph-val').textContent = `${r.toFixed(1)}°`;

                const strY = y.toFixed(1).padStart(5, ' ').replace(/ /g, '&nbsp;');
                const strP = p.toFixed(1).padStart(5, ' ').replace(/ /g, '&nbsp;');
                const strR = r.toFixed(1).padStart(5, ' ').replace(/ /g, '&nbsp;');
                addLog(`SENSOR.RECV [Y:${strY} P:${strP} R:${strR}]`, "INFO");
            }, SETTINGS.GRAPH_UPDATE_MS);

            function animate() {
                requestAnimationFrame(animate);
                if (isDemoMode) {
                    let t = clock.getElapsedTime(), amp = 5;
                    yawSlider.value = (parseFloat(yawSlider.value) + 0.15) % 360;
                    pitchSlider.value = Math.sin(t) * amp;
                    rollSlider.value = Math.cos(t) * amp;
                    updateRotation();
                }
                controls.update(); renderer.render(scene, camera);
                
                document.getElementById('cam-x').textContent = camera.position.x.toFixed(1);
                document.getElementById('cam-y').textContent = camera.position.y.toFixed(1);
                document.getElementById('cam-z').textContent = camera.position.z.toFixed(1);
                document.getElementById('cam-zoom').textContent = camera.position.distanceTo(controls.target).toFixed(1);
            }
            updateRotation(); animate();
            window.addEventListener('resize', () => { 
                camera.aspect = window.innerWidth/window.innerHeight; 
                camera.updateProjectionMatrix(); 
                renderer.setSize(window.innerWidth, window.innerHeight); 
            });
        });
    </script>
</head>
