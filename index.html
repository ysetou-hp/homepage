<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>広報主事室 Web Apps</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        // ==========================================
        // 【設定項目】ここを編集してアプリを追加・変更できます
        // ==========================================
        // 💡 リンク（link）の設定：パターンA（1つのリポジトリ内にフォルダ分け）のため、
        // すべて相対パス「./フォルダ名/」に統一しました。
        // ※ 5番目の「3Dモデリング体験案内」のみ指定の別サイト絶対URLとして設定しています。
        // ※ フォルダ名の大文字小文字、ハイフンの有無は実際のリポジトリ内のフォルダ名と完全一致させてください。
        
        const APPS_CONFIG = [
            {
                title: "中学校データ分布バブルマップ",
                description: "全国の中学校の統計データを地図上にバブルチャート形式で可視化したインタラクティブなマップです。",
                link: "./School-Data-Mapping-App/", 
                gradient: "from-indigo-500 to-purple-600",
                hoverText: "text-blue-600",
                status: "available",
                category: "project",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/><path d="M12 2v2"/><path d="M12 18v2"/></svg>`
            },
            {
                title: "タイムテーブルメーカー",
                description: "オープンキャンパスのタイムテーブルを直感的に作成できるツールです。イベントの重なりを視覚的に調整できます。",
                link: "./Timetable-Maker/",
                gradient: "from-emerald-500 to-teal-600",
                hoverText: "text-emerald-600",
                status: "available",
                category: "project",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`
            },
            {
                title: "弓削丸デジタルツイン",
                description: "練習船『弓削丸』をデジタル空間に再現。船内の様子や航海データなどを視覚的に体験できるプロジェクトです。",
                link: "./Yugemaru-D-Twin/", 
                gradient: "from-cyan-500 to-blue-600",
                hoverText: "text-cyan-600",
                status: "available",
                category: "project",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-9-4-9 4c0 2.9.94 5.34 2.81 7.76"/><path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"/><path d="M12 10V4"/></svg>`
            },
            {
                title: "ShipTRACK表示",
                description: "ファイルから船舶の航跡データを読み込んで地図上にマッピングするツールです。表示範囲を簡単に変更できるUIを実装しており、選択した表示範囲を出力する機能も備えています。",
                link: "./ShipTRACK-Display/", 
                gradient: "from-sky-500 to-indigo-500",
                hoverText: "text-sky-500",
                status: "available",
                category: "project",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>`
            },
            {
                title: "弓削丸スタンプラリー",
                description: "オープンキャンパスやイベント時に、練習船『弓削丸』の船内を巡りながらスタンプを集める体験型デジタルスタンプラリーアプリです。",
                link: "./Yugemaru-Stamp-Rally/",
                gradient: "from-amber-500 to-orange-600",
                hoverText: "text-amber-500",
                status: "available",
                category: "project",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/><path d="M12 6v1"/><path d="M12 17v1"/><path d="M6 12h1"/><path d="M17 12h1"/></svg>`
            },
            {
                title: "3Dモデリング体験案内",
                description: "オープンキャンパスなどで開催する『TinkerCAD』を用いた3Dモデリング体験ワークショップの特設案内ページです。",
                link: "https://ysetou-test01.github.io/OpenCampus/", 
                gradient: "from-fuchsia-500 to-pink-500",
                hoverText: "text-fuchsia-500",
                status: "available",
                category: "experimental",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>`
            },
            {
                title: "360度フォトビューア",
                description: "360度カメラで撮影したパノラマ画像をブラウザ上で直感的に見回すことができるインタラクティブなビューアです。",
                link: "./360-Photo-Viewer/",
                gradient: "from-lime-500 to-green-600",
                hoverText: "text-green-600",
                status: "available",
                category: "experimental",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`
            },
            {
                title: "Design Competition 2026",
                description: "2026年度開催のデザインコンペティション特設ページです。",
                link: "./Design-Competition-2026/",
                gradient: "from-slate-700 to-zinc-900",
                hoverText: "text-slate-700",
                status: "available",
                category: "experimental",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>`
            },
            {
                title: "気象・映像統合観測システム",
                description: "AtomCAMの映像ストリームと、気象・環境・船舶航行などの各種データを一画面に統合表示する観測ダッシュボードです。",
                link: "./Yugemaru-Weather-Monitor/",
                gradient: "from-blue-900 to-slate-800",
                hoverText: "text-blue-500",
                status: "available",
                category: "experimental",
                icon: `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/><circle cx="12" cy="10" r="3"/></svg>`
            }
        ];

        window.onload = () => {
            const projectGrid = document.getElementById('projects-grid');
            const experimentalGrid = document.getElementById('experimental-grid');
            const totalProjectCount = document.getElementById('total-project-count');
            const totalExperimentalCount = document.getElementById('total-experimental-count');
            
            let projectCount = 0;
            let experimentalCount = 0;

            APPS_CONFIG.forEach(app => {
                const isComingSoon = app.status === 'coming-soon';
                const cardClass = isComingSoon 
                    ? "app-card block border border-slate-100 rounded-3xl overflow-hidden bg-white shadow-sm opacity-60 cursor-default h-full flex flex-col"
                    : "app-card block group border border-slate-100 rounded-3xl overflow-hidden bg-white shadow-sm hover:shadow-2xl h-full flex flex-col";
                
                const hoverTextClass = isComingSoon ? "" : `group-hover:${app.hoverText}`;
                const iconScale = isComingSoon ? "" : "group-hover:scale-110";
                const linkAttr = isComingSoon ? "" : `href="${app.link}"`;

                const badge = isComingSoon 
                    ? `<div class="absolute top-4 right-4 bg-slate-800/10 text-slate-500 text-[9px] font-bold px-3 py-1 rounded-full uppercase tracking-widest border border-slate-200">Coming Soon</div>`
                    : "";

                const card = `
                    <a ${linkAttr} class="${cardClass} relative">
                        ${badge}
                        <div class="h-48 bg-gradient-to-br ${app.gradient} flex items-center justify-center p-6 text-white text-4xl shrink-0">
                            <div class="${iconScale} transition-transform duration-300 opacity-80">
                                ${app.icon}
                            </div>
                        </div>
                        <div class="p-8 flex-grow flex flex-col">
                            <h3 class="text-xl font-bold mb-3 ${hoverTextClass} transition-colors">${app.title}</h3>
                            <p class="text-slate-400 text-sm leading-relaxed flex-grow">${app.description}</p>
                        </div>
                    </a>
                `;
                
                if (app.category === "experimental") {
                    experimentalGrid.insertAdjacentHTML('beforeend', card);
                    experimentalCount++;
                } else {
                    projectGrid.insertAdjacentHTML('beforeend', card);
                    projectCount++;
                }
            });

            totalProjectCount.textContent = `Total: ${projectCount} Apps`;
            totalExperimentalCount.textContent = `Total: ${experimentalCount} Apps`;
        };
    </script>

    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            scroll-behavior: smooth;
        }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .app-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .app-card:not(.cursor-default):hover {
            transform: translateY(-8px);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- ナビゲーション -->
    <nav class="fixed w-full z-50 glass shadow-sm">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
                広報主事室
            </div>
        </div>
    </nav>

    <section id="home" class="pt-32 pb-16 px-6">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-4xl md:text-6xl font-bold mb-6 tracking-tight">
                広報主事室<span class="text-blue-600">Webアプリ</span>
            </h1>
            <p class="text-lg text-slate-600 leading-relaxed">
                広報活動を効率化し、情報を分かりやすく届けるためのWebツール集です。<br>
                データの可視化やイベント運営のサポートに活用いただけます。
            </p>
        </div>
    </section>

    <section id="projects" class="py-20 px-6 bg-white">
        <div class="max-w-6xl mx-auto">
            <div class="flex items-center justify-between mb-12">
                <h2 class="text-3xl font-bold flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-600"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
                    Project Tools
                </h2>
                <span id="total-project-count" class="text-slate-400 text-sm">Total: 0 Apps</span>
            </div>
            
            <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
        </div>
    </section>

    <!-- 実験的ツール（Experimental Tools一覧） -->
    <section id="experimental" class="py-20 px-6 bg-white">
        <div class="max-w-6xl mx-auto">
            <div class="flex items-center justify-between mb-12">
                <h2 class="text-3xl font-bold flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-fuchsia-500"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/><path d="M12 21a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/></svg>
                    Experimental Tools
                </h2>
                <span id="total-experimental-count" class="text-slate-400 text-sm">Total: 0 Apps</span>
            </div>
            
            <div id="experimental-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
        </div>
    </section>

    <!-- フッター -->
    <footer class="py-16 bg-white border-t border-slate-100">
